server:
  port: 8090

spring:
  application:
    name: pdca-app
  datasource:
    url: jdbc:postgresql://${PDCA_DB_HOST:localhost}:${PDCA_DB_PORT:54322}/pdca
    username: ${PDCA_DB_USER:pdca}
    password: ${PDCA_DB_PASS:pdca}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:config/liquibase/changelog-master.xml

logging:
  level:
    com.ritense.pdca: DEBUG
