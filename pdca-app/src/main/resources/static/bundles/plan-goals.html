<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doelen &amp; Acties</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #161616; background: #f4f4f4; font-size: 14px; line-height: 1.5; padding: 0;
  }

  .container { max-width: 100%; margin: 0; padding: 0; }

  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: #525252;
  }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid #e0e0e0;
    border-top-color: #0f62fe; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-banner {
    background: #fff1f1; border-left: 3px solid #da1e28;
    padding: 16px; margin-bottom: 24px;
  }

  /* Phase filter bar */
  .phase-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 24px; align-items: center;
  }
  .phase-bar .phase-label {
    font-size: 12px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px; margin-right: 8px;
  }
  .phase-btn {
    padding: 6px 16px; border: 1px solid #8d8d8d; background: #fff;
    color: #161616; font-family: inherit; font-size: 13px; cursor: pointer;
    transition: all 0.15s; border-radius: 0;
  }
  .phase-btn:hover { background: #e8e8e8; }
  .phase-btn.active {
    background: #0f62fe; color: #fff; border-color: #0f62fe;
  }

  /* Toolbar */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .toolbar h2 { font-size: 20px; font-weight: 600; }

  .btn {
    padding: 8px 20px; border: none; font-family: inherit;
    font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .btn-primary { background: #0f62fe; color: #fff; }
  .btn-primary:hover { background: #0353e9; }
  .btn-secondary { background: #e0e0e0; color: #161616; }
  .btn-secondary:hover { background: #c6c6c6; }
  .btn-ghost { background: transparent; color: #0f62fe; padding: 6px 12px; }
  .btn-ghost:hover { background: #e8e8e8; }
  .btn-danger { background: #da1e28; color: #fff; }
  .btn-danger:hover { background: #ba1b23; }
  .btn-success { background: #24a148; color: #fff; }
  .btn-success:hover { background: #198038; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }

  /* Phase group */
  .phase-group { margin-bottom: 32px; }
  .phase-group-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    padding-bottom: 8px; border-bottom: 2px solid #e0e0e0;
  }
  .phase-group-header h3 {
    font-size: 16px; font-weight: 600; color: #161616;
  }
  .phase-group-header .phase-count {
    font-size: 12px; color: #525252;
    background: #e0e0e0; padding: 2px 8px; border-radius: 12px;
  }

  /* Goal card */
  .goal-card {
    background: #fff; margin-bottom: 8px; border-left: 4px solid #e0e0e0;
  }
  .goal-card.status-ACTIVE { border-left-color: #0f62fe; }
  .goal-card.status-ACHIEVED { border-left-color: #24a148; }
  .goal-card.status-NOT_ACHIEVED { border-left-color: #da1e28; }
  .goal-card.status-CANCELLED { border-left-color: #8d8d8d; }

  .goal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; cursor: pointer; user-select: none;
  }
  .goal-header:hover { background: #f4f4f4; }
  .goal-header-left {
    display: flex; align-items: center; gap: 12px; flex: 1;
  }
  .goal-expand {
    width: 20px; height: 20px; color: #525252;
    transition: transform 0.2s; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .goal-expand.open { transform: rotate(90deg); }
  .goal-title { font-weight: 500; font-size: 14px; }
  .goal-description { font-size: 12px; color: #525252; margin-top: 2px; }

  .status-badge {
    display: inline-flex; align-items: center; padding: 2px 10px;
    border-radius: 24px; font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
  }
  .status-PLANNED { background: #e0e0e0; color: #161616; }
  .status-ACTIVE { background: #d0e2ff; color: #0043ce; }
  .status-ACHIEVED { background: #defbe6; color: #0e6027; }
  .status-NOT_ACHIEVED { background: #fff1f1; color: #da1e28; }
  .status-CANCELLED { background: #e0e0e0; color: #525252; text-decoration: line-through; }
  .status-IN_PROGRESS { background: #d0e2ff; color: #0043ce; }
  .status-PENDING_REVIEW { background: #fff8e1; color: #8a6d00; }
  .status-COMPLETED { background: #defbe6; color: #0e6027; }
  .status-REJECTED { background: #fff1f1; color: #da1e28; }

  /* Goal body (expandable) */
  .goal-body {
    display: none; padding: 0 20px 16px 52px;
    border-top: 1px solid #e0e0e0;
  }
  .goal-body.open { display: block; }

  /* Actions */
  .actions-section { margin-top: 12px; }
  .actions-section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .actions-section-header h4 {
    font-size: 12px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .action-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: #f4f4f4; margin-bottom: 4px;
    font-size: 13px;
  }
  .action-row-left { display: flex; align-items: center; gap: 10px; flex: 1; }
  .action-row-right { display: flex; align-items: center; gap: 8px; }
  .action-priority {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    padding: 1px 6px; border-radius: 2px;
  }
  .priority-HIGH { background: #fff1f1; color: #da1e28; }
  .priority-NORMAL { background: #e0e0e0; color: #525252; }
  .priority-LOW { background: #f4f4f4; color: #8d8d8d; }

  .action-assignee { font-size: 11px; color: #525252; }
  .action-due { font-size: 11px; color: #525252; }

  /* Instruments */
  .instruments-section { margin-top: 16px; }
  .instruments-section h4 {
    font-size: 12px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .instrument-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; background: #f4f4f4; margin-bottom: 4px; font-size: 13px;
  }
  .instrument-provider { font-size: 11px; color: #525252; }

  /* Modal overlay */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 1000;
    justify-content: center; align-items: flex-start; padding-top: 80px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; width: 500px; max-width: 90vw; max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid #e0e0e0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 16px; font-weight: 600; }
  .modal-close {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: #525252; padding: 4px;
  }
  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 16px 20px; border-top: 1px solid #e0e0e0;
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 500;
    color: #525252; margin-bottom: 4px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 8px 12px; border: 1px solid #8d8d8d;
    background: #fff; font-family: inherit; font-size: 14px;
    color: #161616;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    outline: 2px solid #0f62fe; outline-offset: -2px; border-color: #0f62fe;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }

  .empty-state {
    text-align: center; padding: 40px; color: #6f6f6f;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Doelen laden...</span>
  </div>
</div>

<!-- Add Goal Modal -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Nieuw doel toevoegen</h3>
      <button class="modal-close" onclick="closeGoalModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Titel *</label>
        <input type="text" id="goalTitle" placeholder="Titel van het doel">
      </div>
      <div class="form-group">
        <label>Beschrijving</label>
        <textarea id="goalDescription" placeholder="Beschrijving van het doel"></textarea>
      </div>
      <div class="form-group">
        <label>Fase *</label>
        <select id="goalPhase"></select>
      </div>
      <div class="form-group">
        <label>Doeltype</label>
        <select id="goalType"><option value="">-- Kies type --</option></select>
      </div>
      <div class="form-group">
        <label>Startdatum</label>
        <input type="date" id="goalStartDate">
      </div>
      <div class="form-group">
        <label>Streefdatum</label>
        <input type="date" id="goalTargetDate">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeGoalModal()">Annuleren</button>
      <button class="btn btn-primary" onclick="saveGoal()">Opslaan</button>
    </div>
  </div>
</div>

<!-- Add Action Modal -->
<div class="modal-overlay" id="actionModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Nieuwe actie toevoegen</h3>
      <button class="modal-close" onclick="closeActionModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Titel *</label>
        <input type="text" id="actionTitle" placeholder="Titel van de actie">
      </div>
      <div class="form-group">
        <label>Beschrijving</label>
        <textarea id="actionDescription" placeholder="Beschrijving van de actie"></textarea>
      </div>
      <div class="form-group">
        <label>Verantwoordelijke</label>
        <input type="text" id="actionAssignee" placeholder="Naam">
      </div>
      <div class="form-group">
        <label>Type verantwoordelijke</label>
        <select id="actionAssigneeType">
          <option value="">-- Selecteer --</option>
          <option value="PROFESSIONAL">Behandelaar</option>
          <option value="SUBJECT">Inwoner / Eigenaar</option>
          <option value="PROVIDER">Aanbieder</option>
        </select>
      </div>
      <div class="form-group">
        <label>Prioriteit</label>
        <select id="actionPriority">
          <option value="NORMAL">Normaal</option>
          <option value="HIGH">Hoog</option>
          <option value="LOW">Laag</option>
        </select>
      </div>
      <div class="form-group">
        <label>Startdatum</label>
        <input type="date" id="actionStartDate">
      </div>
      <div class="form-group">
        <label>Deadline</label>
        <input type="date" id="actionDueDate">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeActionModal()">Annuleren</button>
      <button class="btn btn-primary" onclick="saveAction()">Opslaan</button>
    </div>
  </div>
</div>

<script>
(function() {
  const API_BASE = 'http://localhost:8090';
  var CDK = null;
  let context = {};
  let currentPlan = null;
  let goals = [];
  let actionsByGoal = {};
  let instrumentsByGoal = {};
  let phases = [];
  let activePhaseFilter = null;
  let actionModalGoalId = null;
  let expandedGoals = new Set();

  // --- Iframe Bridge ---
  window.addEventListener('message', function(event) {
    if (event.data && event.data.source === 'valtimo-host' && event.data.event === 'init') {
      context = event.data.payload && event.data.payload.context || {}; CDK = context.caseDefinitionKey || null;
      loadData();
    }
  });
  window.parent.postMessage({source:'valtimo-plugin',event:'ready'}, '*');
  var _initDone = false;
  setTimeout(function() { if (!_initDone) { _initDone = true; loadData(); } }, 500);

  function resizeIframe() {
    requestAnimationFrame(function() {
      window.parent.postMessage({source:'valtimo-plugin',event:'resize',payload:{height:document.documentElement.scrollHeight}}, '*');
    });
  }

  async function loadData() {
    try {
      const resp = await fetch(API_BASE + '/api/v1/plans');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      let plans = await resp.json();
      if (CDK) plans = plans.filter(function(p) { return p.caseDefinitionKey === CDK; });
      plans = plans.filter(function(p) { return p.status === 'ACTIVE' || p.status === 'DRAFT'; });
      if (plans.length === 0) {
        showEmpty(); return;
      }
      currentPlan = plans[0];

      // Load phases config
      if (currentPlan.caseDefinitionKey) {
        try {
          const phaseResp = await fetch(API_BASE + '/api/v1/admin/phase-configs/' + currentPlan.caseDefinitionKey);
          if (phaseResp.ok) {
            const config = await phaseResp.json();
            phases = JSON.parse(config.phases || '[]');
          }
        } catch(e) { /* ignore */ }
      }
      if (phases.length === 0) {
        phases = ['Fase 1', 'Fase 2', 'Fase 3'];
      }

      // Load stamtabel for goal types
      try {
        const gtResp = await fetch(API_BASE + '/api/v1/mock/stamtabel/doeltypen');
        if (gtResp.ok) {
          const types = await gtResp.json();
          var sel = document.getElementById('goalType');
          sel.innerHTML = '<option value="">-- Kies type --</option>';
          types.forEach(function(t) {
            var opt = document.createElement('option');
            opt.value = t.code; opt.textContent = t.label;
            sel.appendChild(opt);
          });
        }
      } catch(e) { /* ignore */ }

      await loadGoals();
    } catch (err) {
      showError('Kan geen verbinding maken: ' + err.message);
    }
  }

  async function loadGoals() {
    const planId = currentPlan.id;
    const [goalsResp, actionsResp, instrumentsResp] = await Promise.all([
      fetch(API_BASE + '/api/v1/plans/' + planId + '/goals'),
      fetch(API_BASE + '/api/v1/plans/' + planId + '/actions'),
      fetch(API_BASE + '/api/v1/plans/' + planId + '/instruments')
    ]);

    goals = goalsResp.ok ? await goalsResp.json() : [];
    const allActions = actionsResp.ok ? await actionsResp.json() : [];
    const allInstruments = instrumentsResp.ok ? await instrumentsResp.json() : [];

    // Group actions and instruments by goalId
    actionsByGoal = {};
    allActions.forEach(function(a) {
      if (!actionsByGoal[a.goalId]) actionsByGoal[a.goalId] = [];
      actionsByGoal[a.goalId].push(a);
    });
    instrumentsByGoal = {};
    allInstruments.forEach(function(i) {
      if (!instrumentsByGoal[i.goalId]) instrumentsByGoal[i.goalId] = [];
      instrumentsByGoal[i.goalId].push(i);
    });

    render();
  }

  function showEmpty() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').innerHTML = '<div class="empty-state"><p>Geen plan gevonden voor deze zaak.</p></div>';
    resizeIframe();
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').innerHTML = '<div class="error-banner">' + escapeHtml(msg) + '</div>';
    resizeIframe();
  }

  function render() {
    document.getElementById('loading').style.display = 'none';

    // Collect unique phases from goals, merge with config phases
    var goalPhases = goals.map(function(g) { return g.phase; });
    var allPhases = phases.slice();
    goalPhases.forEach(function(p) {
      if (allPhases.indexOf(p) === -1) allPhases.push(p);
    });

    // Filter goals
    var filteredGoals = activePhaseFilter
      ? goals.filter(function(g) { return g.phase === activePhaseFilter; })
      : goals;

    // Group by phase
    var grouped = {};
    filteredGoals.forEach(function(g) {
      if (!grouped[g.phase]) grouped[g.phase] = [];
      grouped[g.phase].push(g);
    });

    var html = '';

    // Phase filter bar
    html += '<div class="phase-bar">';
    html += '<span class="phase-label">Fase:</span>';
    html += '<button class="phase-btn' + (!activePhaseFilter ? ' active' : '') + '" onclick="window._filterPhase(null)">Alle</button>';
    allPhases.forEach(function(p) {
      html += '<button class="phase-btn' + (activePhaseFilter === p ? ' active' : '') + '" onclick="window._filterPhase(\'' + escapeAttr(p) + '\')">' + escapeHtml(p) + '</button>';
    });
    html += '</div>';

    // Toolbar
    html += '<div class="toolbar">';
    html += '<h2>Doelen (' + filteredGoals.length + ')</h2>';
    html += '<button class="btn btn-primary" onclick="window._openGoalModal()">+ Doel toevoegen</button>';
    html += '</div>';

    // Phase groups
    var phaseOrder = activePhaseFilter ? [activePhaseFilter] : allPhases;
    phaseOrder.forEach(function(phase) {
      var phaseGoals = grouped[phase] || [];
      if (phaseGoals.length === 0 && activePhaseFilter) return;
      if (phaseGoals.length === 0) return;

      html += '<div class="phase-group">';
      html += '<div class="phase-group-header">';
      html += '<h3>' + escapeHtml(phase) + '</h3>';
      html += '<span class="phase-count">' + phaseGoals.length + ' doel' + (phaseGoals.length !== 1 ? 'en' : '') + '</span>';
      html += '</div>';

      phaseGoals.sort(function(a, b) { return a.sortOrder - b.sortOrder; });
      phaseGoals.forEach(function(goal) {
        html += renderGoalCard(goal);
      });

      html += '</div>';
    });

    if (filteredGoals.length === 0) {
      html += '<div class="empty-state"><p>Geen doelen gevonden' + (activePhaseFilter ? ' voor ' + escapeHtml(activePhaseFilter) : '') + '.</p></div>';
    }

    document.getElementById('app').innerHTML = html;

    // Populate phase dropdown in modal
    var phaseSelect = document.getElementById('goalPhase');
    phaseSelect.innerHTML = '';
    allPhases.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      phaseSelect.appendChild(opt);
    });

    // Restore expanded goals
    expandedGoals.forEach(function(goalId) {
      var body = document.getElementById('body-' + goalId);
      var expand = document.getElementById('expand-' + goalId);
      if (body) { body.classList.add('open'); }
      if (expand) { expand.classList.add('open'); }
    });

    resizeIframe();
  }

  function renderGoalCard(goal) {
    var goalActions = actionsByGoal[goal.id] || [];
    var goalInstruments = instrumentsByGoal[goal.id] || [];

    var html = '<div class="goal-card status-' + goal.status + '">';

    // Header
    html += '<div class="goal-header" onclick="window._toggleGoal(\'' + goal.id + '\')">';
    html += '<div class="goal-header-left">';
    html += '<span class="goal-expand" id="expand-' + goal.id + '">&#9654;</span>';
    html += '<div>';
    html += '<div class="goal-title">' + escapeHtml(goal.title) + '</div>';
    if (goal.description) {
      html += '<div class="goal-description">' + escapeHtml(truncate(goal.description, 80)) + '</div>';
    }
    html += '</div>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    if (goal.goalType) {
      html += '<span style="font-size:11px;color:#525252;">' + escapeHtml(goalTypeLabel(goal.goalType)) + '</span>';
    }
    html += '<span class="status-badge status-' + goal.status + '">' + statusLabel(goal.status) + '</span>';
    html += '</div>';
    html += '</div>';

    // Body (hidden by default)
    html += '<div class="goal-body" id="body-' + goal.id + '">';

    // Goal details
    if (goal.description) {
      html += '<p style="margin-bottom:12px;color:#525252;font-size:13px;">' + escapeHtml(goal.description) + '</p>';
    }
    var meta = [];
    if (goal.startDate) meta.push('Start: ' + formatDate(goal.startDate));
    if (goal.targetEndDate) meta.push('Streefdatum: ' + formatDate(goal.targetEndDate));
    if (goal.progressScore) meta.push('Score: ' + goal.progressScore + '/5');
    if (meta.length > 0) {
      html += '<p style="font-size:12px;color:#525252;margin-bottom:12px;">' + meta.join(' &middot; ') + '</p>';
    }

    // Status change buttons
    html += '<div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap;">';
    if (goal.status === 'PLANNED') {
      html += '<button class="btn btn-primary btn-sm" onclick="window._updateGoalStatus(\'' + goal.id + '\',\'ACTIVE\')">Activeren</button>';
    }
    if (goal.status === 'ACTIVE') {
      html += '<button class="btn btn-success btn-sm" onclick="window._updateGoalStatus(\'' + goal.id + '\',\'ACHIEVED\')">Behaald</button>';
      html += '<button class="btn btn-danger btn-sm" onclick="window._updateGoalStatus(\'' + goal.id + '\',\'NOT_ACHIEVED\')">Niet behaald</button>';
    }
    if (goal.status !== 'CANCELLED' && goal.status !== 'ACHIEVED') {
      html += '<button class="btn btn-secondary btn-sm" onclick="window._updateGoalStatus(\'' + goal.id + '\',\'CANCELLED\')">Annuleren</button>';
    }
    html += '</div>';

    // Actions list
    html += '<div class="actions-section">';
    html += '<div class="actions-section-header">';
    html += '<h4>Acties (' + goalActions.length + ')</h4>';
    html += '<button class="btn btn-ghost btn-sm" onclick="window._openActionModal(\'' + goal.id + '\')">+ Actie</button>';
    html += '</div>';

    if (goalActions.length === 0) {
      html += '<div style="padding:12px;color:#6f6f6f;font-size:13px;text-align:center;">Geen acties</div>';
    } else {
      goalActions.forEach(function(action) {
        html += '<div class="action-row">';
        html += '<div class="action-row-left">';
        html += '<span class="status-badge status-' + action.status + '" style="font-size:10px;">' + statusLabel(action.status) + '</span>';
        html += '<span>' + escapeHtml(action.title) + '</span>';
        if (action.priority && action.priority !== 'NORMAL') {
          html += '<span class="action-priority priority-' + action.priority + '">' + action.priority + '</span>';
        }
        html += '</div>';
        html += '<div class="action-row-right">';
        if (action.assigneeName) {
          html += '<span class="action-assignee">' + escapeHtml(action.assigneeName) + '</span>';
        }
        if (action.dueDate) {
          html += '<span class="action-due">' + formatDate(action.dueDate) + '</span>';
        }
        if (action.status === 'PENDING_REVIEW') {
          html += '<button class="btn btn-success btn-sm" onclick="window._approveAction(\'' + action.id + '\')">Goedkeuren</button>';
          html += '<button class="btn btn-danger btn-sm" onclick="window._rejectAction(\'' + action.id + '\')">Afwijzen</button>';
        }
        if (action.status === 'IN_PROGRESS') {
          html += '<button class="btn btn-ghost btn-sm" onclick="window._submitForReview(\'' + action.id + '\')">Indienen</button>';
        }
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    // Instruments list
    if (goalInstruments.length > 0) {
      html += '<div class="instruments-section">';
      html += '<h4>Instrumenten (' + goalInstruments.length + ')</h4>';
      goalInstruments.forEach(function(inst) {
        html += '<div class="instrument-row">';
        html += '<span class="status-badge status-' + inst.status + '" style="font-size:10px;">' + statusLabel(inst.status) + '</span>';
        html += '<span>' + escapeHtml(inst.title) + '</span>';
        if (inst.providerName) {
          html += '<span class="instrument-provider">' + escapeHtml(inst.providerName) + '</span>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // goal-body
    html += '</div>'; // goal-card
    return html;
  }

  // --- Global event handlers ---
  window._filterPhase = function(phase) {
    activePhaseFilter = phase;
    render();
  };

  window._toggleGoal = function(goalId) {
    var body = document.getElementById('body-' + goalId);
    var expand = document.getElementById('expand-' + goalId);
    if (body.classList.contains('open')) {
      body.classList.remove('open');
      expand.classList.remove('open');
      expandedGoals.delete(goalId);
    } else {
      body.classList.add('open');
      expand.classList.add('open');
      expandedGoals.add(goalId);
    }
    resizeIframe();
  };

  window._updateGoalStatus = async function(goalId, newStatus) {
    try {
      await fetch(API_BASE + '/api/v1/goals/' + goalId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      await loadGoals();
    } catch(e) { alert('Fout bij status wijziging: ' + e.message); }
  };

  window._openGoalModal = function() {
    document.getElementById('goalModal').classList.add('open');
    document.getElementById('goalTitle').value = '';
    document.getElementById('goalDescription').value = '';
    document.getElementById('goalType').value = '';
    document.getElementById('goalStartDate').value = '';
    document.getElementById('goalTargetDate').value = '';
  };
  window.closeGoalModal = function() {
    document.getElementById('goalModal').classList.remove('open');
  };

  window.saveGoal = async function() {
    var title = document.getElementById('goalTitle').value.trim();
    var phase = document.getElementById('goalPhase').value;
    if (!title) { alert('Titel is verplicht'); return; }

    var body = { title: title, phase: phase };
    var desc = document.getElementById('goalDescription').value.trim();
    if (desc) body.description = desc;
    var gtype = document.getElementById('goalType').value.trim();
    if (gtype) body.goalType = gtype;
    var sd = document.getElementById('goalStartDate').value;
    if (sd) body.startDate = sd;
    var td = document.getElementById('goalTargetDate').value;
    if (td) body.targetEndDate = td;

    try {
      await fetch(API_BASE + '/api/v1/plans/' + currentPlan.id + '/goals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      closeGoalModal();
      await loadGoals();
    } catch(e) { alert('Fout bij opslaan: ' + e.message); }
  };

  window._openActionModal = function(goalId) {
    actionModalGoalId = goalId;
    document.getElementById('actionModal').classList.add('open');
    document.getElementById('actionTitle').value = '';
    document.getElementById('actionDescription').value = '';
    document.getElementById('actionAssignee').value = '';
    document.getElementById('actionAssigneeType').value = '';
    document.getElementById('actionPriority').value = 'NORMAL';
    document.getElementById('actionStartDate').value = '';
    document.getElementById('actionDueDate').value = '';
  };
  window.closeActionModal = function() {
    document.getElementById('actionModal').classList.remove('open');
    actionModalGoalId = null;
  };

  window.saveAction = async function() {
    var title = document.getElementById('actionTitle').value.trim();
    if (!title) { alert('Titel is verplicht'); return; }

    var body = { title: title };
    var desc = document.getElementById('actionDescription').value.trim();
    if (desc) body.description = desc;
    var assignee = document.getElementById('actionAssignee').value.trim();
    if (assignee) body.assigneeName = assignee;
    var atype = document.getElementById('actionAssigneeType').value;
    if (atype) body.assigneeType = atype;
    var prio = document.getElementById('actionPriority').value;
    if (prio) body.priority = prio;
    var sd = document.getElementById('actionStartDate').value;
    if (sd) body.startDate = sd;
    var dd = document.getElementById('actionDueDate').value;
    if (dd) body.dueDate = dd;

    try {
      var targetGoalId = actionModalGoalId;
      await fetch(API_BASE + '/api/v1/goals/' + targetGoalId + '/actions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      expandedGoals.add(targetGoalId);
      closeActionModal();
      await loadGoals();
    } catch(e) { alert('Fout bij opslaan: ' + e.message); }
  };

  window._approveAction = async function(actionId) {
    try {
      await fetch(API_BASE + '/api/v1/actions/' + actionId + '/approve', { method: 'POST' });
      await loadGoals();
    } catch(e) { alert('Fout: ' + e.message); }
  };

  window._rejectAction = async function(actionId) {
    try {
      await fetch(API_BASE + '/api/v1/actions/' + actionId + '/reject', { method: 'POST' });
      await loadGoals();
    } catch(e) { alert('Fout: ' + e.message); }
  };

  window._submitForReview = async function(actionId) {
    try {
      await fetch(API_BASE + '/api/v1/actions/' + actionId + '/submit-for-review', { method: 'POST' });
      await loadGoals();
    } catch(e) { alert('Fout: ' + e.message); }
  };

  // --- Helpers ---
  function escapeHtml(str) {
    if (!str) return '';
    var d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }
  function escapeAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
  function formatDate(ds) {
    if (!ds) return '';
    var p = ds.split('-');
    return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : ds;
  }
  function truncate(str, len) {
    return str.length > len ? str.substring(0, len) + '...' : str;
  }
  function goalTypeLabel(t) {
    var labels = {
      INVENTARISATIE:'Inventarisatie', ONTWIKKELING:'Ontwikkeling', PRAKTISCH:'Praktisch',
      VERKENNING:'Verkenning', PLAATSING:'Plaatsing', BORGING:'Borging',
      ANALYSE:'Analyse', HERSTEL:'Herstel', CONTROLE:'Controle'
    };
    return labels[t] || t;
  }

  function statusLabel(s) {
    var labels = {
      PLANNED:'Gepland', ACTIVE:'Actief', ACHIEVED:'Behaald',
      NOT_ACHIEVED:'Niet behaald', CANCELLED:'Geannuleerd',
      IN_PROGRESS:'In uitvoering', PENDING_REVIEW:'In beoordeling',
      COMPLETED:'Afgerond', REJECTED:'Afgekeurd'
    };
    return labels[s] || s;
  }
})();
</script>
</body>
</html>
