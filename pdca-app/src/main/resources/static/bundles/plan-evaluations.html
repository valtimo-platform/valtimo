<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluaties</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #161616; background: #f4f4f4; font-size: 14px; line-height: 1.5; padding: 0;
  }

  .container { max-width: 100%; margin: 0; padding: 0; }

  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: #525252;
  }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid #e0e0e0;
    border-top-color: #0f62fe; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-banner {
    background: #fff1f1; border-left: 3px solid #da1e28;
    padding: 16px; margin-bottom: 24px;
  }

  .empty-state {
    text-align: center; padding: 40px; color: #6f6f6f;
  }

  /* Header with count badges */
  .page-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 24px;
  }
  .page-header-left h1 {
    font-size: 28px; font-weight: 600; color: #161616; margin-bottom: 8px;
  }
  .count-badges {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .count-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #525252;
  }
  .count-badge .count-value {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .count-value.total { background: #e0e0e0; color: #161616; }
  .count-value.completed { background: #defbe6; color: #0e6027; }
  .count-value.planned { background: #fff8e1; color: #8a6d00; }

  .btn {
    padding: 8px 20px; border: none; font-family: inherit;
    font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .btn-primary { background: #0f62fe; color: #fff; }
  .btn-primary:hover { background: #0353e9; }

  /* Filter bar */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 24px; align-items: center;
  }
  .filter-bar .filter-label {
    font-size: 12px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px; margin-right: 8px;
  }
  .filter-btn {
    padding: 6px 16px; border: 1px solid #8d8d8d; background: #fff;
    color: #161616; font-family: inherit; font-size: 13px; cursor: pointer;
    transition: all 0.15s; border-radius: 0;
  }
  .filter-btn:hover { background: #e8e8e8; }
  .filter-btn.active {
    background: #0f62fe; color: #fff; border-color: #0f62fe;
  }

  /* Timeline */
  .timeline {
    position: relative; padding-left: 0;
  }
  .timeline-item {
    display: flex; gap: 0; margin-bottom: 0;
    position: relative;
  }

  /* Date column */
  .timeline-date-col {
    width: 120px; min-width: 120px;
    display: flex; flex-direction: column; align-items: flex-end;
    padding-right: 24px; padding-top: 20px;
    position: relative;
  }
  .timeline-date-text {
    font-size: 13px; font-weight: 600; color: #161616;
    white-space: nowrap;
  }
  .timeline-date-day {
    font-size: 11px; color: #525252; margin-top: 2px;
    white-space: nowrap;
  }

  /* Connector line */
  .timeline-connector {
    position: absolute;
    right: -1px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #e0e0e0;
  }
  .timeline-item:first-child .timeline-connector { top: 28px; }
  .timeline-item:last-child .timeline-connector { bottom: calc(100% - 28px); }
  .timeline-item:only-child .timeline-connector { display: none; }

  .timeline-dot {
    position: absolute;
    right: -5px;
    top: 24px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #0f62fe;
    border: 2px solid #fff;
    z-index: 1;
  }
  .timeline-dot.status-COMPLETED { background: #24a148; }
  .timeline-dot.status-PLANNED { background: #f1c21b; }
  .timeline-dot.status-CANCELLED { background: #8d8d8d; }

  /* Card column */
  .timeline-card-col {
    flex: 1; padding: 8px 0 8px 24px;
  }
  .eval-card {
    background: #fff; border-left: 4px solid #e0e0e0;
    transition: box-shadow 0.15s;
  }
  .eval-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .eval-card.type-INTAKE { border-left-color: #8a3ffc; }
  .eval-card.type-PROGRESS { border-left-color: #0f62fe; }
  .eval-card.type-EVALUATION { border-left-color: #24a148; }
  .eval-card.type-INSPECTION { border-left-color: #ff832b; }
  .eval-card.type-CRISIS { border-left-color: #da1e28; }

  .eval-card-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; cursor: pointer; user-select: none;
  }
  .eval-card-header:hover { background: #f4f4f4; }
  .eval-card-header-left {
    display: flex; align-items: center; gap: 10px; flex: 1;
  }
  .eval-expand {
    width: 20px; height: 20px; color: #525252;
    transition: transform 0.2s; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .eval-expand.open { transform: rotate(90deg); }

  .eval-card-title {
    display: flex; flex-direction: column; gap: 4px; flex: 1;
  }
  .eval-card-badges {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }

  /* Eval type badges */
  .eval-type-badge {
    display: inline-flex; padding: 3px 10px; border-radius: 2px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; white-space: nowrap;
  }
  .eval-type-INTAKE { background: #e8daff; color: #6929c4; }
  .eval-type-PROGRESS { background: #d0e2ff; color: #0043ce; }
  .eval-type-EVALUATION { background: #defbe6; color: #0e6027; }
  .eval-type-INSPECTION { background: #fff2cc; color: #8a6d00; }
  .eval-type-CRISIS { background: #fff1f1; color: #da1e28; }

  /* Status badges */
  .status-badge {
    display: inline-flex; align-items: center; padding: 2px 10px;
    border-radius: 24px; font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
  }
  .status-PLANNED { background: #fff8e1; color: #8a6d00; }
  .status-COMPLETED { background: #defbe6; color: #0e6027; }
  .status-CANCELLED { background: #e0e0e0; color: #525252; text-decoration: line-through; }

  .eval-summary-text {
    font-size: 13px; color: #525252; margin-top: 4px;
  }
  .eval-participants {
    font-size: 12px; color: #6f6f6f; margin-top: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .eval-participants-icon {
    font-size: 14px;
  }

  /* Expandable body */
  .eval-card-body {
    display: none; padding: 0 20px 20px 50px;
    border-top: 1px solid #e0e0e0;
  }
  .eval-card-body.open { display: block; }

  /* Goal progress section */
  .goal-progress-section {
    margin-top: 16px;
  }
  .goal-progress-section h4 {
    font-size: 12px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
  }

  .goal-progress-item {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 10px 12px; background: #f4f4f4; margin-bottom: 4px;
  }
  .goal-progress-name {
    font-size: 13px; font-weight: 500; color: #161616;
    min-width: 160px; flex-shrink: 0;
  }
  .goal-progress-score {
    display: flex; gap: 4px; align-items: center;
    min-width: 80px; flex-shrink: 0;
  }
  .score-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #0f62fe; background: #fff;
  }
  .score-dot.filled { background: #0f62fe; }
  .goal-progress-score .score-label {
    font-size: 11px; color: #525252; margin-left: 6px;
  }
  .goal-progress-explanation {
    font-size: 12px; color: #525252; flex: 1;
  }

  /* Action points */
  .action-points-section {
    margin-top: 16px;
  }
  .action-points-section h4 {
    font-size: 12px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .action-point-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: #f4f4f4; margin-bottom: 4px;
    font-size: 13px;
  }
  .action-point-bullet {
    width: 6px; height: 6px; border-radius: 50%;
    background: #0f62fe; flex-shrink: 0;
  }

  /* Details grid */
  .eval-details-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-top: 16px;
  }
  @media (max-width: 600px) { .eval-details-grid { grid-template-columns: 1fr; } }

  .eval-detail-item {
    font-size: 13px;
  }
  .eval-detail-label {
    font-size: 11px; font-weight: 600; color: #525252;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px;
  }
  .eval-detail-value { color: #161616; }

  @media (max-width: 600px) {
    .page-header { flex-direction: column; gap: 12px; }
    .timeline-date-col { width: 80px; min-width: 80px; padding-right: 16px; }
    .timeline-card-col { padding-left: 16px; }
    .goal-progress-item { flex-direction: column; gap: 6px; }
    .goal-progress-name { min-width: 0; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Evaluaties laden...</span>
  </div>
</div>

<script>
(function() {
  var API_BASE = 'http://localhost:8090';
  var CDK = null;
  var context = {};
  var currentPlan = null;
  var evaluations = [];
  var goals = [];
  var activeFilter = null;

  // --- Iframe Bridge ---
  window.addEventListener('message', function(event) {
    if (event.data && event.data.source === 'valtimo-host' && event.data.event === 'init') {
      context = event.data.payload && event.data.payload.context || {}; CDK = context.caseDefinitionKey || null;
      loadData();
    }
  });
  window.parent.postMessage({source:'valtimo-plugin',event:'ready'}, '*');
  var _initDone = false;
  setTimeout(function() { if (!_initDone) { _initDone = true; loadData(); } }, 500);

  function resizeIframe() {
    requestAnimationFrame(function() {
      window.parent.postMessage({source:'valtimo-plugin',event:'resize',payload:{height:document.documentElement.scrollHeight}}, '*');
    });
  }

  // --- Data Loading ---
  async function loadData() {
    try {
      var resp = await fetch(API_BASE + '/api/v1/plans');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var plans = await resp.json();
      if (CDK) plans = plans.filter(function(p) { return p.caseDefinitionKey === CDK; });
      plans = plans.filter(function(p) { return p.status === 'ACTIVE' || p.status === 'DRAFT'; });

      if (plans.length === 0) {
        showEmpty();
        return;
      }

      // Take the first ACTIVE plan, or the first plan if none active
      currentPlan = plans.find(function(p) { return p.status === 'ACTIVE'; }) || plans[0];

      // Fetch evaluations and goals in parallel
      var planId = currentPlan.id;
      var results = await Promise.all([
        fetch(API_BASE + '/api/v1/plans/' + planId + '/evaluations').catch(function() { return { ok: false }; }),
        fetch(API_BASE + '/api/v1/plans/' + planId + '/goals').catch(function() { return { ok: false }; })
      ]);

      evaluations = results[0].ok ? await results[0].json() : [];
      goals = results[1].ok ? await results[1].json() : [];

      render();
    } catch (err) {
      showError('Kan geen verbinding maken met de PDCA service: ' + err.message);
    }
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').innerHTML = '<div class="error-banner">' + escapeHtml(msg) + '</div>';
    resizeIframe();
  }

  function showEmpty() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').innerHTML = '<div class="empty-state"><p>Geen plan gevonden voor deze zaak.</p></div>';
    resizeIframe();
  }

  // --- Rendering ---
  function render() {
    document.getElementById('loading').style.display = 'none';

    // Sort evaluations by date, most recent first
    var sorted = evaluations.slice().sort(function(a, b) {
      var da = a.actualDate || a.scheduledDate || '';
      var db = b.actualDate || b.scheduledDate || '';
      return db.localeCompare(da);
    });

    // Collect unique eval types
    var evalTypes = [];
    evaluations.forEach(function(ev) {
      if (ev.evalType && evalTypes.indexOf(ev.evalType) === -1) {
        evalTypes.push(ev.evalType);
      }
    });

    // Apply filter
    var filtered = activeFilter
      ? sorted.filter(function(ev) { return ev.evalType === activeFilter; })
      : sorted;

    // Calculate counts
    var totalCount = evaluations.length;
    var completedCount = evaluations.filter(function(ev) { return ev.status === 'COMPLETED'; }).length;
    var plannedCount = evaluations.filter(function(ev) { return ev.status === 'PLANNED'; }).length;

    var html = '';

    // Header
    html += '<div class="page-header">';
    html += '  <div class="page-header-left">';
    html += '    <h1>Evaluaties</h1>';
    html += '    <div class="count-badges">';
    html += '      <span class="count-badge"><span class="count-value total">' + totalCount + '</span> Totaal</span>';
    html += '      <span class="count-badge"><span class="count-value completed">' + completedCount + '</span> Afgerond</span>';
    html += '      <span class="count-badge"><span class="count-value planned">' + plannedCount + '</span> Gepland</span>';
    html += '    </div>';
    html += '  </div>';
    html += '  <button class="btn btn-primary" onclick="window._newEvaluation()">+ Nieuwe evaluatie</button>';
    html += '</div>';

    // Filter bar
    html += '<div class="filter-bar">';
    html += '  <span class="filter-label">Filter:</span>';
    html += '  <button class="filter-btn' + (!activeFilter ? ' active' : '') + '" onclick="window._setFilter(null)">Alle</button>';
    evalTypes.forEach(function(type) {
      html += '<button class="filter-btn' + (activeFilter === type ? ' active' : '') + '" onclick="window._setFilter(\'' + escapeAttr(type) + '\')">' + evalTypeLabel(type) + '</button>';
    });
    html += '</div>';

    // Timeline
    if (filtered.length === 0) {
      html += '<div class="empty-state"><p>Geen evaluaties gevonden' + (activeFilter ? ' voor type ' + evalTypeLabel(activeFilter) : '') + '.</p></div>';
    } else {
      html += '<div class="timeline">';
      filtered.forEach(function(ev, index) {
        html += renderTimelineItem(ev, index, filtered.length);
      });
      html += '</div>';
    }

    document.getElementById('app').innerHTML = html;
    resizeIframe();
  }

  function renderTimelineItem(ev, index, total) {
    var date = ev.actualDate || ev.scheduledDate;
    var rawScores = ev.goalProgress || ev.goalScores || '[]';
    var goalScores = typeof rawScores === 'string' ? tryParseJson(rawScores, []) : rawScores;
    var rawAp = ev.actionPoints || '[]';
    var actionPoints = typeof rawAp === 'string' ? tryParseJson(rawAp, []) : rawAp;
    var rawPart = ev.participants || '';
    var participants = typeof rawPart === 'string' ? (rawPart ? rawPart.split(',').map(function(s){return s.trim()}) : []) : rawPart;
    var evalId = ev.id || ('eval-' + index);

    var html = '<div class="timeline-item">';

    // Date column with connector
    html += '<div class="timeline-date-col">';
    html += '  <div class="timeline-date-text">' + (date ? formatDate(date) : 'Geen datum') + '</div>';
    html += '  <div class="timeline-date-day">' + (date ? formatDayName(date) : '') + '</div>';
    html += '  <div class="timeline-connector"></div>';
    html += '  <div class="timeline-dot status-' + ev.status + '"></div>';
    html += '</div>';

    // Card column
    html += '<div class="timeline-card-col">';
    html += '<div class="eval-card type-' + (ev.evalType || '') + '">';

    // Card header
    html += '<div class="eval-card-header" onclick="window._toggleEval(\'' + evalId + '\')">';
    html += '<div class="eval-card-header-left">';
    html += '<span class="eval-expand" id="expand-' + evalId + '">&#9654;</span>';
    html += '<div class="eval-card-title">';
    html += '  <div class="eval-card-badges">';
    html += '    <span class="eval-type-badge eval-type-' + (ev.evalType || '') + '">' + evalTypeLabel(ev.evalType) + '</span>';
    html += '    <span class="status-badge status-' + ev.status + '">' + statusLabel(ev.status) + '</span>';
    html += '  </div>';
    if (ev.summary) {
      html += '  <div class="eval-summary-text">' + escapeHtml(truncate(ev.summary, 120)) + '</div>';
    }
    if (participants.length > 0) {
      html += '  <div class="eval-participants">';
      html += '    <span class="eval-participants-icon">&#128100;</span> ';
      html += '    ' + escapeHtml(participants.join(', '));
      html += '  </div>';
    }
    html += '</div>'; // eval-card-title
    html += '</div>'; // eval-card-header-left
    html += '</div>'; // eval-card-header

    // Card body (expandable)
    html += '<div class="eval-card-body" id="body-' + evalId + '">';

    // Details grid
    html += '<div class="eval-details-grid">';
    if (ev.scheduledDate) {
      html += '<div class="eval-detail-item">';
      html += '  <div class="eval-detail-label">Geplande datum</div>';
      html += '  <div class="eval-detail-value">' + formatDate(ev.scheduledDate) + '</div>';
      html += '</div>';
    }
    if (ev.actualDate) {
      html += '<div class="eval-detail-item">';
      html += '  <div class="eval-detail-label">Werkelijke datum</div>';
      html += '  <div class="eval-detail-value">' + formatDate(ev.actualDate) + '</div>';
      html += '</div>';
    }
    if (ev.evaluator) {
      html += '<div class="eval-detail-item">';
      html += '  <div class="eval-detail-label">Evaluator</div>';
      html += '  <div class="eval-detail-value">' + escapeHtml(ev.evaluator) + '</div>';
      html += '</div>';
    }
    if (ev.location) {
      html += '<div class="eval-detail-item">';
      html += '  <div class="eval-detail-label">Locatie</div>';
      html += '  <div class="eval-detail-value">' + escapeHtml(ev.location) + '</div>';
      html += '</div>';
    }
    html += '</div>';

    // Full summary
    if (ev.summary) {
      html += '<div style="margin-top:16px;">';
      html += '  <div class="eval-detail-label">Samenvatting</div>';
      html += '  <div style="font-size:13px;color:#161616;line-height:1.6;white-space:pre-wrap;margin-top:4px;">' + escapeHtml(ev.summary) + '</div>';
      html += '</div>';
    }

    // Conclusions
    if (ev.conclusions) {
      html += '<div style="margin-top:16px;">';
      html += '  <div class="eval-detail-label">Conclusies</div>';
      html += '  <div style="font-size:13px;color:#161616;line-height:1.6;white-space:pre-wrap;margin-top:4px;">' + escapeHtml(ev.conclusions) + '</div>';
      html += '</div>';
    }

    // Goal progress
    if (goalScores.length > 0) {
      html += '<div class="goal-progress-section">';
      html += '<h4>Doelvoortgang</h4>';
      goalScores.forEach(function(gs) {
        var goalName = findGoalName(gs.goalId) || 'Doel';
        var score = gs.score || 0;
        html += '<div class="goal-progress-item">';
        html += '  <div class="goal-progress-name">' + escapeHtml(goalName) + '</div>';
        html += '  <div class="goal-progress-score">';
        for (var i = 1; i <= 5; i++) {
          html += '<span class="score-dot' + (i <= score ? ' filled' : '') + '"></span>';
        }
        html += '    <span class="score-label">' + score + '/5</span>';
        html += '  </div>';
        html += '  <div class="goal-progress-explanation">' + (gs.explanation ? escapeHtml(gs.explanation) : '<span style="color:#a8a8a8;font-style:italic;">Geen toelichting</span>') + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    // Action points
    if (actionPoints.length > 0) {
      html += '<div class="action-points-section">';
      html += '<h4>Actiepunten</h4>';
      actionPoints.forEach(function(ap) {
        var text = (typeof ap === 'string') ? ap : (ap.description || ap.title || '');
        html += '<div class="action-point-item">';
        html += '  <span class="action-point-bullet"></span>';
        html += '  <span>' + escapeHtml(text) + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // eval-card-body
    html += '</div>'; // eval-card
    html += '</div>'; // timeline-card-col
    html += '</div>'; // timeline-item

    return html;
  }

  // --- Global event handlers ---
  window._setFilter = function(type) {
    activeFilter = type;
    render();
  };

  window._toggleEval = function(evalId) {
    var body = document.getElementById('body-' + evalId);
    var expand = document.getElementById('expand-' + evalId);
    if (body.classList.contains('open')) {
      body.classList.remove('open');
      expand.classList.remove('open');
    } else {
      body.classList.add('open');
      expand.classList.add('open');
    }
    resizeIframe();
  };

  window._newEvaluation = function() {
    alert('Nieuwe evaluatie aanmaken is nog niet beschikbaar in dit prototype.');
  };

  // --- Helpers ---
  function tryParseJson(str, fallback) {
    try { return JSON.parse(str); } catch(e) { return fallback; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function escapeAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    if (parts.length === 3) return parts[2] + '-' + parts[1] + '-' + parts[0];
    return dateStr;
  }

  function formatDayName(dateStr) {
    if (!dateStr) return '';
    try {
      var d = new Date(dateStr + 'T00:00:00');
      var days = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
      return days[d.getDay()];
    } catch(e) {
      return '';
    }
  }

  function truncate(str, len) {
    if (!str) return '';
    return str.length > len ? str.substring(0, len) + '...' : str;
  }

  function findGoalName(goalId) {
    if (!goalId) return null;
    var goal = goals.find(function(g) { return g.id === goalId; });
    return goal ? goal.title : null;
  }

  function statusLabel(status) {
    var labels = {
      PLANNED: 'Gepland',
      COMPLETED: 'Afgerond',
      CANCELLED: 'Geannuleerd',
      IN_PROGRESS: 'In uitvoering'
    };
    return labels[status] || status;
  }

  function evalTypeLabel(type) {
    var labels = {
      INTAKE: 'Intake',
      PROGRESS: 'Voortgang',
      EVALUATION: 'Evaluatie',
      INSPECTION: 'Inspectie',
      CRISIS: 'Crisis'
    };
    return labels[type] || type || 'Onbekend';
  }
})();
</script>
</body>
</html>
