name: Backend - Publish release

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      project_version:
        description: "Base semantic version (e.g. 13.6.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      project_version:
        description: "Base semantic version (e.g. 13.6.0)"
        required: true

env:
  PROJECT_VERSION: ${{ inputs.project_version || github.event.inputs.project_version }}

jobs:
  build_run_tests:
    uses: ./.github/workflows/backend_build_test_libraries.yml

  # Release images are built to GHCR only here (no push_to_dockerhub). The
  # smoke_and_promote jobs below boot each image and only then copy it to Docker
  # Hub, so Docker Hub never receives an image that has not booted.
  build_gzac_image:
    name: Build gzac-backend image (GHCR)
    needs:
      - build_run_tests
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend_build_push_docker_image.yml
    with:
      backend_libraries_build_artifact_name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
      variant: gzac
      project_version: ${{ inputs.project_version || github.event.inputs.project_version }}
    secrets: inherit

  build_valtimo_image:
    name: Build valtimo-backend image (GHCR)
    needs:
      - build_run_tests
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend_build_push_docker_image.yml
    with:
      backend_libraries_build_artifact_name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
      variant: valtimo
      project_version: ${{ inputs.project_version || github.event.inputs.project_version }}
    secrets: inherit

  build_evenementenvergunning_image:
    name: Build gzac-evenementenvergunning-backend image (GHCR)
    needs:
      - build_run_tests
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend_build_push_docker_image.yml
    with:
      backend_libraries_build_artifact_name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
      variant: evenementenvergunning
      project_version: ${{ inputs.project_version || github.event.inputs.project_version }}
    secrets: inherit

  smoke_and_promote_gzac:
    name: Smoke test + promote gzac-backend
    needs:
      - build_gzac_image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend_smoke_and_promote.yml
    with:
      image_name: gzac-backend
      release_image_tag: ${{ inputs.project_version || github.event.inputs.project_version }}
    secrets: inherit

  smoke_and_promote_valtimo:
    name: Smoke test + promote valtimo-backend
    needs:
      - build_valtimo_image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend_smoke_and_promote.yml
    with:
      image_name: valtimo-backend
      release_image_tag: ${{ inputs.project_version || github.event.inputs.project_version }}
    secrets: inherit

  smoke_and_promote_evenementenvergunning:
    name: Smoke test + promote gzac-evenementenvergunning-backend
    needs:
      - build_evenementenvergunning_image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend_smoke_and_promote.yml
    with:
      image_name: gzac-evenementenvergunning-demo-backend
      release_image_tag: ${{ inputs.project_version || github.event.inputs.project_version }}
    secrets: inherit

  publish:
    needs:
      - build_run_tests
    runs-on: ubuntu-latest
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
          path: .

      - name: Check license compliance
        run: ./gradlew :backend:checkLicense

      - name: Fail if disallowed licenses found
        run: |
          sudo apt-get update -qq && sudo apt-get install -y jq
          FILE="backend/build/reports/dependency-license/dependencies-without-allowed-license.json"
          if [[ -f "$FILE" ]]; then
            COUNT=$(jq '.dependenciesWithoutAllowedLicenses | length' "$FILE" 2>/dev/null || echo 0)
            if [[ "$COUNT" -gt 0 ]]; then
              echo "::warning::Disallowed licenses found. See dependencies-without-allowed-license.json (count=$COUNT)."
            fi
          else
            echo "Error: dependency license report not found."
            exit 1
          fi

      # Idempotency guard: Maven Central releases are immutable, so re-running a
      # release whose artifacts already landed would fail on the duplicate. Probe
      # a representative artifact (core) on Maven Central; if this version is
      # already there, skip both publish steps so the release run is re-runnable.
      - name: Check whether this version is already on Maven Central
        id: maven_central
        run: |
          set -euo pipefail
          URL="https://repo1.maven.org/maven2/com/ritense/valtimo/core/${PROJECT_VERSION}.RELEASE/"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$URL" || echo 000)"
          if [ "$code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::com.ritense.valtimo:core:${PROJECT_VERSION}.RELEASE already on Maven Central — skipping Sonatype/JReleaser publish (idempotent re-run)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Not on Maven Central yet (HTTP ${code}) — proceeding with publish."
          fi

      # Sonatype sunset guard: Sonatype enforces new publishing limits from 1 Oct 2026,
      # so we stop dual-publishing to it a day early (30 Sep 2026) to be safe.
      # After the cutoff only the S3 publish runs — no manual edit
      # needed, the guard flips on the date. Adjust CUTOFF to move the boundary.
      - name: Determine whether Sonatype publishing is still open
        id: sonatype_window
        run: |
          set -euo pipefail
          CUTOFF="2026-09-30"
          TODAY="$(date -u +%F)"
          if [[ "$TODAY" < "$CUTOFF" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "Before Sonatype cutoff ($CUTOFF) — dual-publishing to Sonatype + S3."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Past Sonatype cutoff ($CUTOFF) — publishing to S3 only."
          fi

      - name: Publish to Sonatype staging
        if: ${{ steps.maven_central.outputs.already_published != 'true' && steps.sonatype_window.outputs.open == 'true' }}
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ env.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ env.SONATYPE_PASSWORD }}
        run: ./gradlew --no-parallel publishAllPublicationsToSonatypeRepository -PprojectVersion="${PROJECT_VERSION}.RELEASE"

      - name: Deploy with JReleaser to Maven Central
        if: ${{ steps.maven_central.outputs.already_published != 'true' && steps.sonatype_window.outputs.open == 'true' }}
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ env.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ env.SONATYPE_PASSWORD }}
        run: ./gradlew :backend:jreleaserDeploy --stacktrace -PprojectVersion="${PROJECT_VERSION}.RELEASE"

      - name: Archive Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: backend/build/reports

  # Second leg of the dual publish: push the same release artifacts to the AWS S3
  # bucket. Runs unconditionally (no Sonatype sunset guard) so it becomes the sole publish
  # target once Sonatype is switched off.
  publish_s3:
    name: Publish to S3
    needs:
      - build_run_tests
    uses: ./.github/workflows/backend_publish_to_s3.yml
    with:
      project_version: ${{ inputs.project_version || github.event.inputs.project_version }}.RELEASE
      s3_bucket: valtimo-releases
      build_artifact_name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
    secrets:
      s3_access_key_id: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_ID }}
      s3_secret_access_key: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_SECRET }}
