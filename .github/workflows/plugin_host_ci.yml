name: Plugin host & SDK - build and test

permissions:
  contents: read

on:
  push:
    paths:
      - "plugin-host/**"
      - ".github/workflows/plugin_host_ci.yml"
  pull_request:
    paths:
      - "plugin-host/**"
      - ".github/workflows/plugin_host_ci.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22 matches the host runtime requirement (Extism runInWorker needs Node >= 22, plan §7).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json

      # The SDK is a file: dependency of the app and must be built first so the app's `tsc` can
      # resolve @valtimo/plugin-sdk types.
      - name: SDK - install
        working-directory: plugin-host/plugin-sdk
        run: npm ci

      - name: SDK - build (tsc)
        working-directory: plugin-host/plugin-sdk
        run: npm run build

      - name: SDK - test
        working-directory: plugin-host/plugin-sdk
        run: npm run test:cov

      - name: App - install
        working-directory: plugin-host/app
        run: npm ci

      - name: App - build (tsc)
        working-directory: plugin-host/app
        run: npm run build

      - name: App - test
        working-directory: plugin-host/app
        run: npm run test:cov

  # L3 (Wasm/Extism) tests: compile the fixture plugin with the real SDK toolchain and run it under
  # Extism. Kept separate from `unit` because it needs the extism-js compiler, which is not committed
  # (plugin-host/.bin is gitignored) and is downloaded here.
  wasm:
    runs-on: ubuntu-latest
    env:
      # Pin the Extism JS PDK compiler version. Bump together with @extism/js-pdk in the fixture.
      EXTISM_JS_VERSION: "1.5.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json
            plugin-host/test-fixtures/test-plugin/package-lock.json

      - name: Download extism-js compiler
        run: |
          mkdir -p plugin-host/.bin
          url="https://github.com/extism/js-pdk/releases/download/v${EXTISM_JS_VERSION}/extism-js-x86_64-linux-v${EXTISM_JS_VERSION}.gz"
          curl -sSfL "$url" -o /tmp/extism-js.gz
          gunzip -c /tmp/extism-js.gz > plugin-host/.bin/extism-js
          chmod +x plugin-host/.bin/extism-js
          plugin-host/.bin/extism-js --version

      # The fixture bundles @valtimo/plugin-sdk from its built dist, so the SDK must be built first.
      - name: SDK - install & build
        working-directory: plugin-host/plugin-sdk
        run: npm ci && npm run build

      - name: Fixture - install deps
        working-directory: plugin-host/test-fixtures/test-plugin
        run: npm install

      - name: App - install
        working-directory: plugin-host/app
        run: npm ci

      # globalSetup compiles the fixture to Wasm (finds extism-js on PATH via plugin-host/.bin).
      - name: App - Wasm/Extism tests (L3)
        working-directory: plugin-host/app
        run: npm run test:wasm

  # L4 (integration) tests: real Postgres + RabbitMQ via Testcontainers. The ubuntu runner ships a
  # working Docker daemon, which Testcontainers uses directly.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json

      # The app's tsc/type surface pulls @valtimo/plugin-sdk, so build the SDK first.
      - name: SDK - install & build
        working-directory: plugin-host/plugin-sdk
        run: npm ci && npm run build

      - name: App - install
        working-directory: plugin-host/app
        run: npm ci

      - name: App - integration tests (Testcontainers)
        working-directory: plugin-host/app
        run: npm run test:int
