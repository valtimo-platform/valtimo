name: Plugin host & SDK - build and test

permissions:
  contents: read

on:
  push:
    paths:
      - "plugin-host/**"
      - ".github/workflows/plugin_host_ci.yml"
  pull_request:
    paths:
      - "plugin-host/**"
      - ".github/workflows/plugin_host_ci.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22 matches the host runtime requirement (Extism runInWorker needs Node >= 22).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json

      # The SDK is a file: dependency of the app and must be built first so the app's `tsc` can
      # resolve @valtimo/plugin-sdk types.
      - name: SDK - install
        working-directory: plugin-host/plugin-sdk
        run: npm ci

      - name: SDK - build (tsc)
        working-directory: plugin-host/plugin-sdk
        run: npm run build

      - name: SDK - test
        working-directory: plugin-host/plugin-sdk
        run: npm run test:cov

      - name: App - install
        working-directory: plugin-host/app
        run: npm ci

      - name: App - build (tsc)
        working-directory: plugin-host/app
        run: npm run build

      - name: App - test
        working-directory: plugin-host/app
        run: npm run test:cov

  # L3 (Wasm/Extism) tests: compile the fixture plugin with the real SDK toolchain and run it under
  # Extism. Kept separate from `unit` because it needs the Wasm toolchain (extism-js + binaryen),
  # which is not committed — the SDK's toolchain module downloads the versions pinned in
  # plugin-host/plugin-sdk/bin/toolchain.mjs on first use.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json
            plugin-host/test-fixtures/test-plugin/package-lock.json

      # The fixture bundles @valtimo/plugin-sdk from its built dist, so the SDK must be built first.
      - name: SDK - install & build
        working-directory: plugin-host/plugin-sdk
        run: npm ci && npm run build

      - name: Fixture - install deps
        working-directory: plugin-host/test-fixtures/test-plugin
        run: npm install

      - name: App - install
        working-directory: plugin-host/app
        run: npm ci

      # globalSetup compiles the fixture to Wasm; valtimo-plugin-build downloads extism-js and
      # binaryen into plugin-host/.bin/ on first use.
      - name: App - Wasm/Extism tests (L3)
        working-directory: plugin-host/app
        run: npm run test:wasm

  # Proves the documented "zero to buildable plugin in one command" path: scaffold a project with
  # every bundle type, install it, type-check it, and compile + pack it into an uploadable zip.
  # Also the only place the scaffold's template sources (plugin-sdk/templates/**) are type-checked
  # and bundled at all — they sit outside the SDK's tsconfig `include` on purpose, because they are
  # payload rather than compiled code. Ubuntu only: cross-OS toolchain behaviour is already covered
  # by `bootstrap`, and this job's value is the scaffold path, not the platform matrix.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin-host/plugin-sdk/package-lock.json

      - name: SDK - install & build
        working-directory: plugin-host/plugin-sdk
        run: npm ci && npm run build

      # --sdk file: because @valtimo/plugin-sdk is resolved from this checkout, not the registry.
      # --yes keeps it non-interactive; --no-install keeps generation and install separate in the log.
      # --bundles all is spelled out rather than relying on the default, which is `config` alone:
      # this leg exists to compile all six bundle templates, so it has to name all six.
      - name: Scaffold a plugin (all bundle types)
        run: |
          node plugin-host/plugin-sdk/bin/valtimo-plugin-init.mjs "$RUNNER_TEMP/scaffolded" \
            --plugin-id ci-scaffold --yes --bundles all --locales en,nl \
            --sdk "file:$GITHUB_WORKSPACE/plugin-host/plugin-sdk" --no-install

      - name: Scaffolded plugin - install
        working-directory: ${{ runner.temp }}/scaffolded
        run: npm install

      # esbuild only transpiles, so without this step nothing would ever type-check the templates.
      - name: Scaffolded plugin - type-check
        working-directory: ${{ runner.temp }}/scaffolded
        run: npx tsc --noEmit

      # Downloads extism-js + binaryen into the toolchain dir on first use, like every other build.
      - name: Scaffolded plugin - build & pack
        working-directory: ${{ runner.temp }}/scaffolded
        run: npm run build:pack

      - name: Verify the package was produced
        run: test -f "$RUNNER_TEMP/scaffolded/dist/ci-scaffold-0.1.0.zip"

      # The base template is what most authors start from, and it is the only variant that exercises
      # the no-React, no-frontend dependency set.
      - name: Scaffold a plugin (--minimal)
        run: |
          node plugin-host/plugin-sdk/bin/valtimo-plugin-init.mjs "$RUNNER_TEMP/scaffolded-minimal" \
            --plugin-id ci-scaffold-minimal --yes --minimal \
            --sdk "file:$GITHUB_WORKSPACE/plugin-host/plugin-sdk" --no-install

      - name: Scaffolded plugin (--minimal) - install, type-check, build & pack
        working-directory: ${{ runner.temp }}/scaffolded-minimal
        run: npm install && npx tsc --noEmit && npm run build:pack

      - name: Verify the minimal package was produced
        run: test -f "$RUNNER_TEMP/scaffolded-minimal/dist/ci-scaffold-minimal-0.1.0.zip"

  # L4 (integration) tests: real Postgres + RabbitMQ via Testcontainers. The ubuntu runner ships a
  # working Docker daemon, which Testcontainers uses directly.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json

      # The app's tsc/type surface pulls @valtimo/plugin-sdk, so build the SDK first.
      - name: SDK - install & build
        working-directory: plugin-host/plugin-sdk
        run: npm ci && npm run build

      - name: App - install
        working-directory: plugin-host/app
        run: npm ci

      - name: App - integration tests (Testcontainers)
        working-directory: plugin-host/app
        run: npm run test:int

  # Validates the documented one-command bootstrap (`npm run setup`) on a fresh checkout for every
  # supported development platform — including the toolchain auto-download and the sample-plugin
  # Wasm build. Docker is intentionally not required by setup, so this runs on all three OSes.
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin-host/plugin-sdk/package-lock.json
            plugin-host/app/package-lock.json
            plugin-host/sample-plugins/case-summary/package-lock.json
            plugin-host/sample-apps/demo-app/package-lock.json
            plugin-host/test-fixtures/test-plugin/package-lock.json

      - name: Bootstrap (npm run setup)
        working-directory: plugin-host
        run: npm run setup -- --ci

      - name: Verify sample plugin package was produced
        working-directory: plugin-host
        run: node --input-type=module -e "const {samplePluginZipPath} = await import('./scripts/setup.mjs'); const {existsSync} = await import('node:fs'); const zip = samplePluginZipPath(); if (!existsSync(zip)) { console.error('missing ' + zip); process.exit(1); } console.log('OK ' + zip);"
        shell: bash

  # Build-only mirror of the release image build (plugin_host_publish_release.yml), so a broken
  # Dockerfile fails the PR instead of the release. amd64 only and no push: this leg proves the
  # image compiles from a clean checkout, not that it is publishable.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      # Context is plugin-host/, not plugin-host/app/: the app depends on the SDK through a
      # `file:../plugin-sdk` dependency, so the SDK must be inside the context.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: plugin-host
          file: plugin-host/app/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: valtimo-plugin-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the just-built image with no database reachable: the process must fail loudly
      # rather than hang or exit 0. Cheap proof that the entrypoint and the runtime dependency
      # tree are intact — full boot is covered by the release smoke test.
      - name: Verify the image runs
        run: |
          set -euo pipefail
          out="$(docker run --rm -e ADMIN_TOKEN=ci-admin-token-value -e DB_HOST=127.0.0.1 \
            valtimo-plugin-host:ci node -e 'console.log("entrypoint ok:", process.version)')"
          echo "$out"
          printf '%s' "$out" | grep -q 'entrypoint ok: v22'

      - name: Verify the image runs as non-root
        run: |
          set -euo pipefail
          uid="$(docker run --rm valtimo-plugin-host:ci id -u)"
          echo "runtime uid: ${uid}"
          [ "$uid" != "0" ]
