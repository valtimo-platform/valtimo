name: Backend - Publish release candidate

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      project_version:
        description: "Base semantic version (e.g. 13.6.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      project_version:
        description: "Base semantic version (e.g. 13.6.0)"
        required: true

jobs:
  build_run_tests:
    uses: ./.github/workflows/backend_build_test_libraries.yml

  publish:
    needs: [build_run_tests]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref_name, 'rc/') }}
    env:
      PROJECT_VERSION: ${{ inputs.project_version || github.event.inputs.project_version }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      # Required: backend/gradle/publishing-module.gradle only applies the 'signing'
      # plugin when both of these are set. Without them nothing produces .asc files
      # and Sonatype rejects every component with "Missing signature for file".
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      JRELEASER_MAVENCENTRAL_sonatype_STAGE: UPLOAD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
          path: .

      - name: Compute version from branch
        id: version
        shell: bash
        run: |
          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "::error::Project version input is required."
            exit 1
          fi
          if [[ ! "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Project version must be <semver>-<rc_number> (e.g. 13.5.0-1). Current: $PROJECT_VERSION."
            exit 1
          fi
          VERSION_RC="$PROJECT_VERSION"
          echo "version_rc=$VERSION_RC" >> "$GITHUB_OUTPUT"

      - name: Check license compliance (non-blocking)
        continue-on-error: true
        run: ./gradlew :backend:checkLicense

      - name: Warn if disallowed licenses found
        run: |
          sudo apt-get update -qq && sudo apt-get install -y jq
          FILE="backend/build/reports/dependency-license/dependencies-without-allowed-license.json"
          if [[ -f "$FILE" ]]; then
            COUNT=$(jq '.dependenciesWithoutAllowedLicenses | length' "$FILE" 2>/dev/null || echo 0)
            if [[ "$COUNT" -gt 0 ]]; then
              echo "::warning::Disallowed licenses found. See dependencies-without-allowed-license.json (count=$COUNT)."
            fi
          fi

      - name: Publish to Sonatype staging
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ env.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ env.SONATYPE_PASSWORD }}
        run: ./gradlew --no-parallel publishAllPublicationsToSonatypeRepository -PprojectVersion="${{ steps.version.outputs.version_rc }}"

      - name: Deploy with JReleaser to Maven Central
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ env.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ env.SONATYPE_PASSWORD }}
        run: ./gradlew :backend:jreleaserDeploy --stacktrace -PprojectVersion="${{ steps.version.outputs.version_rc }}"

      - name: Archive Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: backend/build/reports

  # Second leg of the dual publish: push the same RC artifacts to the AWS S3 bucket
  # (RCs share the valtimo-releases bucket with releases).
  publish_s3:
    name: Publish to S3
    needs:
      - build_run_tests
    if: ${{ startsWith(github.ref_name, 'rc/') }}
    uses: ./.github/workflows/backend_publish_to_s3.yml
    with:
      project_version: ${{ inputs.project_version || github.event.inputs.project_version }}
      s3_bucket: valtimo-releases
      build_artifact_name: ${{ needs.build_run_tests.outputs.build_artifact_name }}
    secrets:
      s3_access_key_id: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_ID }}
      s3_secret_access_key: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_SECRET }}
