name: Handle PR close/merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  print_something:
    runs-on: ubuntu-latest
    permissions: {} 
    steps:
      - id: printStep
        shell: bash
        env:
          EVENT_STRING: ${{ toJson(github.event.pull_request) }}
        run: |
          echo "This is the github.event.pull_request JSON payload:"
          echo "$EVENT_STRING"

  delete_test_env_if_labeled:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'test env') }}
    uses: ./.github/workflows/delete_test_env.yml
    secrets: inherit
    with:
      env_name: pr${{ github.event.pull_request.number }}
