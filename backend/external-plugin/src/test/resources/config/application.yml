spring:
    # Several modules are on the test classpath only so EndpointDescriptionCoverageTest can scan
    # their controllers, but their auto-configurations cannot start in this module's IT context:
    # mandrill re-registers the mail JPA repositories that MailAutoConfiguration already provides
    # (a duplicate the strict, no-override test context rejects), and the Exact plugin requires
    # exact.baseUrl/exact.redirectUrl properties this module doesn't define.
    autoconfigure:
        exclude:
            - com.ritense.mail.autoconfigure.MandrillMailAutoConfiguration
            - com.ritense.exact.config.ExactPluginAutoConfiguration
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
    liquibase:
        enabled: false
    jpa:
        show_sql: true
        open-in-view: false
        properties:
            hibernate:
                hbm2ddl.auto: none
                generate_statistics: false
                naming-strategy: org.springframework.boot.orm.jpa.hibernate.SpringNamingStrategy
                cache:
                    use_second_level_cache: false
                    use_query_cache: false
                    region.factory_class: org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory
                format_sql: true
                jdbc:
                    time_zone: UTC
                connection:
                    provider_disables_autocommit: true
        hibernate:
            ddl-auto: none

valtimo:
    plugin:
        encryption-secret: "abcdefghijklmnop"

spring-actuator:
    username: admin
    password: password

operaton:
    bpm:
        history-level: audit
        generic-properties:
            properties:
                enforceHistoryTimeToLive: false
