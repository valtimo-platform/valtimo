pluginManager.withPlugin('maven-publish') {
    publishing {
        publications {
            maven(MavenPublication) {
                pom {
                    name = 'Documenten API WOPI module'
                    description = 'The Documenten API WOPI module contains the plugin to preview and edit documents using the Web application Open Platform Interface (WOPI). This enables users to view, edit and collaborate on documents stored in the DRC.'
                    developers {
                        developer {
                            id = "baseflow"
                            name = "Baseflow B.V."
                            email = "help@baseflow.com"
                        }
                    }
                }
            }
        }
    }
}