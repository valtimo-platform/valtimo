plugins {
    id 'war'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(platform(project(":backend:dependencies:valtimo-dependency-versions")))

    implementation(project(":backend:dependencies:valtimo-dependencies"))

    implementation(project(":backend:document-generation:local-document-generation"))
    implementation(project(":backend:aws:s3-resource"))
    implementation(project(":backend:mail:local-mail"))
    implementation(project(":backend:milestones"))
    implementation(project(":backend:zgw:object-management"))
    implementation(project(":backend:plugin-authentication:objecten-api-authentication"))
    implementation(project(":backend:zgw:objecten-api"))
    implementation(project(":backend:zgw:objecttypen-api"))
    implementation(project(":backend:zgw:zaken-api"))

    implementation("io.github.oshai:kotlin-logging")

    implementation "org.postgresql:postgresql:$postgresqlDriverVersion"

    if (System.getProperty("os.arch") == "aarch64") {
        runtimeOnly("io.netty:netty-resolver-dns-native-macos::osx-aarch_64")
    }

    testImplementation(project(":backend:test-utils-common"))
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

springBoot {
    mainClass = "com.ritense.valtimo.ApplicationKt"
}

def localRunTaskNames = ["bootRun", "bootRunWithDocker"]
def runningLocalApp = gradle.startParameter.taskNames.any { requested ->
    localRunTaskNames.any { requested == it || requested.endsWith(":$it") }
}
def includeDevSources = (project.findProperty("includeDev")?.toString()?.toBoolean() ?: false) || runningLocalApp

if (includeDevSources) {
    extensions.configure(org.jetbrains.kotlin.gradle.dsl.KotlinJvmProjectExtension) { kotlinExt ->
        kotlinExt.sourceSets.named("main") { kotlinSourceSet ->
            kotlinSourceSet.kotlin.srcDir("src/dev/kotlin")
        }
    }
    sourceSets {
        main {
            resources.srcDir("src/dev/resources")
        }
    }
}

apply from: "${rootProject.projectDir}/backend/gradle/valtimo-app.gradle"

def sharedComposeFilePath = project(":backend:apps:dev").file("docker-compose.yaml").path
def s3ComposeFilePath = file("docker-compose.yaml").path
dockerCompose {
    useComposeFiles = [sharedComposeFilePath, s3ComposeFilePath]
}

dockerCompose.isRequiredBy(tasks.named("bootRun"))
