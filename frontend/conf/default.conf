server {
    listen       8080;
    server_name  localhost;

    gzip on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types    text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/json image/svg+xml application/manifest+json;
    gzip_vary on;

    # Serve pre-compressed .gz next to the asset when the build produced one
    gzip_static on;

    location ~ /(api|management|v3|mock-api) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://gzac-backend:8080;
    }

    # Rewritten by envsubst on container start — must never be cached
    location = /assets/config.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # Points at the current hashed bundles, so it must be revalidated every time
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # Root-level bundles carry a content hash (outputHashing: all), so they are immutable
    location ~ ^/[^/]+\.(js|css)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root   /usr/share/nginx/html;
        # ensure all request go to javascript/angular in index.html
        try_files $uri $uri/ /index.html?$args;
    }
}
