<div *ngIf="assistantAvailable$ | async" class="assistant">
  <valtimo-assistant-teaser
    *ngIf="$teaserMessageKey() && !$teaserDismissed() && !$open()"
    [messageKey]="$teaserMessageKey()!"
    (closeEvent)="onTeaserClose()"
    (openEvent)="onLauncherClick()"
  ></valtimo-assistant-teaser>

  <valtimo-assistant-panel
    *ngIf="$open()"
    (minimizeEvent)="onPanelMinimize()"
  ></valtimo-assistant-panel>

  <button
    *ngIf="!$open()"
    [attr.aria-label]="'assistant.launcher.open' | translate"
    [attr.data-test-id]="testIds.launcher"
    (click)="onLauncherClick()"
    class="assistant-launcher"
    type="button"
  >
    <svg cdsIcon="ai-launch" size="24"></svg>
  </button>
</div>
