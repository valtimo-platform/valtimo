<div [attr.data-test-id]="testIds.teaser" aria-live="polite" class="assistant-teaser" role="status">
  <button
    [attr.data-test-id]="testIds.teaserClose"
    (click)="closeEvent.emit()"
    class="assistant-teaser__close"
    type="button"
  >
    <svg cdsIcon="close" size="16"></svg>

    <span>{{ 'assistant.teaser.close' | translate }}</span>
  </button>

  <button (click)="openEvent.emit()" class="assistant-teaser__bubble" type="button">
    {{ messageKey | translate }}
  </button>
</div>
