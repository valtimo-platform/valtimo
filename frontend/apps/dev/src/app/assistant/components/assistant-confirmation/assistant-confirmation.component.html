<div [attr.data-test-id]="testIds.confirmation" class="assistant-confirmation">
  <p class="assistant-confirmation__title">{{ 'assistant.confirmation.title' | translate }}</p>

  <p *ngIf="description" class="assistant-confirmation__description">{{ description }}</p>

  <p class="assistant-confirmation__hint">{{ 'assistant.confirmation.hint' | translate }}</p>

  <div class="assistant-confirmation__actions">
    <button
      [attr.data-test-id]="testIds.confirmationConfirm"
      (click)="confirmEvent.emit()"
      cdsButton="primary"
      size="sm"
      type="button"
    >
      {{ 'assistant.confirmation.confirm' | translate }}
    </button>

    <button
      [attr.data-test-id]="testIds.confirmationCancel"
      (click)="cancelEvent.emit()"
      cdsButton="ghost"
      size="sm"
      type="button"
    >
      {{ 'assistant.confirmation.cancel' | translate }}
    </button>
  </div>
</div>
