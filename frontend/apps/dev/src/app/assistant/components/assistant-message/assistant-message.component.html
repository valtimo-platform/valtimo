<div
  [ngClass]="'assistant-message--' + message.author"
  [attr.data-test-id]="testIds.message"
  class="assistant-message"
>
  <div *ngIf="message.author === 'assistant'" class="assistant-message__meta">
    <span class="assistant-message__avatar">
      <svg cdsIcon="ai-label" size="16"></svg>
    </span>

    <span class="assistant-message__name">{{ 'assistant.name' | translate }}</span>

    <span class="assistant-message__time">{{ message.timestamp | date: 'HH:mm' }}</span>
  </div>

  <!-- Own copy is interpolated; backend text is markdown from the model, so it goes through
       the hardening pipe and Angular's sanitizer. -->
  <p *ngIf="message.textKey; else backendText" class="assistant-message__text">
    {{ message.textKey | translate }}
  </p>

  <ng-template #backendText>
    <div
      [innerHTML]="message.text | assistantMarkdown"
      class="assistant-message__text assistant-message__text--markdown"
    ></div>
  </ng-template>
</div>
