<div
  class="search-input-container"
  [class.search-input-container--expanded]="isExpanded || !expandable || value"
  [class.search-input-container--has-error]="hasInvalidFields"
>
  <button
    *ngIf="expandable && !isExpanded && !value"
    class="search-input-expand-button"
    type="button"
    (click)="onExpand()"
  >
    <svg cdsIcon="search" size="16"></svg>
  </button>

  <div
    *ngIf="isExpanded || !expandable || value"
    class="search-input-wrapper"
  >
    <svg cdsIcon="search" size="16" class="search-input-icon"></svg>

    <div class="search-input-highlight-container">
      <div class="search-input-highlight-overlay" aria-hidden="true">
        <span
          *ngFor="let segment of segments"
          [class.search-input-field-name]="segment.isFieldName"
          [class.search-input-invalid]="segment.isInvalid"
        >{{ segment.text }}</span>
      </div>

      <input
        #inputElement
        class="search-input-field"
        type="text"
        [value]="value"
        [placeholder]="placeholder"
        (input)="onInput($event)"
        (keydown)="onKeyDown($event)"
        (blur)="onBlur()"
        data-test-id="searchInputWithValidation"
      />
    </div>

    <button
      *ngIf="value"
      class="search-input-clear-button"
      type="button"
      (click)="onClear()"
    >
      <svg cdsIcon="close" size="16"></svg>
    </button>
  </div>
</div>
