<aside
  [attr.aria-hidden]="!$visible()"
  [attr.data-test-id]="testIds.panel"
  [class.valtimo-side-panel--resizing]="$resizing()"
  [class.valtimo-side-panel--visible]="$visible() && !!$current()"
  [style.width.px]="$width()"
  class="valtimo-side-panel"
>
  <div
    [attr.aria-label]="'sidePanel.resize' | translate"
    [attr.data-test-id]="testIds.resizeHandle"
    (keydown.arrowLeft)="onResizeKey(1)"
    (keydown.arrowRight)="onResizeKey(-1)"
    (mousedown)="onResizeStart($event)"
    aria-orientation="vertical"
    class="valtimo-side-panel__resize-handle"
    role="separator"
    tabindex="0"
  ></div>

  @if ($current(); as current) {
    <header class="valtimo-side-panel__header">
      <div class="valtimo-side-panel__titles">
        <h2 class="valtimo-side-panel__title">{{ current.title }}</h2>

        @if (current.subtitle) {
          @if (current.subtitleLink) {
            <a
              [attr.data-test-id]="testIds.subtitleLink"
              [routerLink]="current.subtitleLink"
              class="valtimo-side-panel__subtitle"
              >{{ current.subtitle }}</a
            >
          } @else {
            <span class="valtimo-side-panel__subtitle">{{ current.subtitle }}</span>
          }
        }
      </div>

      <button
        [attr.aria-label]="'sidePanel.close' | translate"
        [attr.data-test-id]="testIds.closeButton"
        [iconOnly]="true"
        (click)="onClose()"
        cdsButton="ghost"
        size="sm"
      >
        <svg cdsIcon="close" class="cds--btn__icon" size="16"></svg>
      </button>
    </header>
  }

  <div class="valtimo-side-panel__body">
    @for (offer of $offers(); track offer.key) {
      <ng-container *ngComponentOutlet="offer.component; inputs: offer.inputs ?? {}"></ng-container>
    }
  </div>
</aside>
