<cds-modal valtimoCdsModal>
  <div class="cds--modal is-visible">
    <button class="cds--modal-close outer-close" type="button"></button>
    @if (showExpandedDropdown) {
    <cds-combo-box>
      <div class="cds--list-box cds--list-box--expanded">
        <input class="combo-input" aria-expanded="true" />
      </div>
    </cds-combo-box>
    } @if (showNested) {
    <cds-modal>
      <div class="cds--modal is-visible">
        <button class="cds--modal-close nested-close" type="button"></button>
      </div>
    </cds-modal>
    }
  </div>
</cds-modal>

<!-- Separate host for the min-height behaviour: it needs a `.cds--modal-content` to write to, but
     not a `cds-modal` element (the ESC handling above is what depends on the real tag). -->
<div class="min-height-host" valtimoCdsModal [minContentHeight]="600">
  <div class="cds--modal-content"></div>
</div>
