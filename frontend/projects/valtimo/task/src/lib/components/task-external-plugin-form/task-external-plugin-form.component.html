@if ($state() === 'loading') {
  <div style="width: 100%; display: flex; justify-content: center; padding: 1rem">
    <cds-loading size="sm"></cds-loading>
  </div>
} @else if ($state() === 'error') {
  <cds-inline-notification
    [notificationObj]="{
      type: 'error',
      title: ('interface.error' | translate),
      message: ('taskDetail.externalPluginTaskForm.tokenError' | translate),
      showClose: false,
      lowContrast: true,
    }"
  ></cds-inline-notification>
} @else {
  <valtimo-external-plugin-iframe
    [bundleUrl]="bundleUrl"
    [configurationId]="configurationId"
    [context]="context"
    [pluginDataUrl]="$pluginDataUrl()"
    [userToken]="$userToken()"
    (taskCompletedEvent)="onTaskCompleted()"
  ></valtimo-external-plugin-iframe>
}
