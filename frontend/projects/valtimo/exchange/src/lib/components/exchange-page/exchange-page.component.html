<div class="exchange-page">
  <ng-container [ngSwitch]="$state()">
    <div *ngSwitchCase="'loading'" class="exchange-page__status">
      <cds-loading [isActive]="true" [overlay]="false" size="normal"></cds-loading>
    </div>

    <valtimo-no-results
      *ngSwitchCase="'disabled'"
      [attr.data-test-id]="testIds.notConfigured"
      [title]="'exchange.notConfigured' | translate"
      [description]="'exchange.notConfiguredDescription' | translate"
    ></valtimo-no-results>

    <div
      *ngSwitchCase="'error'"
      class="exchange-page__status exchange-page__status--error"
      [attr.data-test-id]="testIds.loadFailed"
    >
      {{ 'exchange.loadError' | translate }}
    </div>

    <ng-container *ngSwitchCase="'ready'">
      <div *ngIf="!$iframeReady() && !$loadTimedOut()" class="exchange-page__status">
        <cds-loading [isActive]="true" [overlay]="false" size="normal"></cds-loading>
      </div>

      <div
        *ngIf="!$iframeReady() && $loadTimedOut()"
        class="exchange-page__status exchange-page__status--error"
        [attr.data-test-id]="testIds.loadError"
      >
        {{ 'exchange.loadError' | translate }}
      </div>

      @if ($catalogUrl(); as catalogUrl) {
        <valtimo-external-plugin-iframe
          [autoHeight]="true"
          [bundleUrl]="catalogUrl"
          (installArtifactEvent)="onInstallRequested($event)"
          (locationChangedEvent)="onLocationChanged($event)"
          (readyEvent)="onReady()"
        ></valtimo-external-plugin-iframe>
      }
    </ng-container>
  </ng-container>
</div>

<valtimo-case-management-upload
  [open]="$caseUploadOpen()"
  [presetFile]="$presetFile()"
  (closeModal)="onCaseUploadClosed($event)"
></valtimo-case-management-upload>

<valtimo-building-block-management-upload-modal></valtimo-building-block-management-upload-modal>

<valtimo-exchange-install-confirm-modal
  [artifact]="$confirmArtifact()"
  [dependencies]="$confirmDependencies()"
  [open]="$confirmOpen()"
  (cancelEvent)="onConfirmCancelled()"
  (confirmEvent)="onConfirmed()"
></valtimo-exchange-install-confirm-modal>
