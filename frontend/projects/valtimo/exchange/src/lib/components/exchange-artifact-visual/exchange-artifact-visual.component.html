@if ($src(); as src) {
  <img
    class="exchange-artifact-visual__image"
    alt=""
    [attr.data-test-id]="testIds.tileLogo"
    [src]="src"
    (error)="onError()"
  />
} @else {
  <span
    class="exchange-artifact-visual__monogram"
    aria-hidden="true"
    [attr.data-test-id]="testIds.tileMonogram"
    [ngClass]="'exchange-monogram--' + $colorIndex()"
  >
    {{ $initials() }}
  </span>
}
