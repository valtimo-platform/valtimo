<cds-modal valtimoCdsModal size="lg" [open]="open()" (close)="closeEvent.emit()">
  <cds-modal-header showCloseButton="true" (closeSelect)="closeEvent.emit()">
    <p cdsModalHeaderLabel>{{ 'exchange.detail.screenshots' | translate }}</p>
    <h3 cdsModalHeaderHeading>{{ title() }}</h3>
  </cds-modal-header>

  <section cdsModalContent class="exchange-screenshot-gallery">
    @if ($current(); as src) {
      <div class="exchange-screenshot-gallery__stage">
        @if ($hasMultiple()) {
          <button
            cdsButton="ghost"
            type="button"
            [attr.aria-label]="'exchange.gallery.previous' | translate"
            [attr.data-test-id]="testIds.previous"
            [iconOnly]="true"
            (click)="previous()"
          >
            <svg cdsIcon="chevron--left" size="16"></svg>
          </button>
        }

        <img
          class="exchange-screenshot-gallery__image"
          [alt]="'exchange.detail.screenshotAlt' | translate: {index: index() + 1}"
          [attr.data-test-id]="testIds.image"
          [src]="src"
        />

        @if ($hasMultiple()) {
          <button
            cdsButton="ghost"
            type="button"
            [attr.aria-label]="'exchange.gallery.next' | translate"
            [attr.data-test-id]="testIds.next"
            [iconOnly]="true"
            (click)="next()"
          >
            <svg cdsIcon="chevron--right" size="16"></svg>
          </button>
        }
      </div>

      <div class="exchange-screenshot-gallery__footer">
        <span [attr.data-test-id]="testIds.counter">
          {{
            'exchange.gallery.counter' | translate: {current: index() + 1, total: images().length}
          }}
        </span>
      </div>
    }
  </section>
</cds-modal>
