<div
  class="updates"
  *ngIf="{
    actionItems: actionItems$ | async,
    items: items$ | async,
    loading: loading$ | async,
    pending: pending$ | async,
  } as obs"
>
  <valtimo-no-results
    *ngIf="!obs.loading && !obs.items?.length"
    [alwaysRenderVertically]="true"
    [description]="'packageManagement.noUpdatesDescription' | translate"
    [smallPadding]="true"
    [title]="'packageManagement.noUpdates' | translate"
    illustration="valtimo-layout/img/emptystate-success.svg"
  ></valtimo-no-results>

  <ng-container *ngIf="obs.loading || obs.items?.length">
    <div class="updates__actions">
      <button
        cdsButton="primary"
        size="sm"
        [attr.data-test-id]="testIds.updateAllButton"
        [disabled]="(obs.pending?.size ?? 0) > 0"
        (click)="onUpdateAll()"
      >
        {{ 'packageManagement.updateAll' | translate: {count: obs.items?.length} }}
      </button>
    </div>

    <valtimo-carbon-list
      [actionItems]="obs.actionItems ?? []"
      [fields]="fields"
      [items]="obs.items ?? []"
      [loading]="obs.loading ?? false"
      paginationIdentifier="marketplaceUpdates"
    ></valtimo-carbon-list>
  </ng-container>
</div>
