<div class="main-content">
  <div class="container-fluid">
    <div class="row mb-5">
      <div class="col-12">
        <div class="alert alert-warning pl-2 plr-2" role="alert">
          <div class="icon"><span class="mdi mdi-alert-triangle"></span></div>
          <div class="message" [innerHTML]="'Process migration warning' | translate"></div>
        </div>
      </div>
    </div>
    <div class="row mb-5">
      <div class="col-4">
        <cds-combo-box
          [dropUp]="false"
          [appendInline]="true"
          [label]="'Source Definition' | translate"
          [placeholder]="'- ' + ('Source Definition' | translate) + ' -'"
          [items]="sourceDefinitionItems"
          (selected)="onDefinitionSelected($event, 'source')"
          (clear)="onSourceDefinitionClear($event)"
        >
          <cds-dropdown-list></cds-dropdown-list>
        </cds-combo-box>
      </div>
      <div class="col-2">
        <cds-combo-box
                #sourceVersionCombobox
          [dropUp]="false"
          [appendInline]="true"
          [label]="'Source Definition' | translate"
          [placeholder]="'- ' + ('Source Version' | translate) + ' -'"
          [items]="sourceVersionItems"
          (selected)="onVersionSelected($event, 'source')"
        >
          <cds-dropdown-list></cds-dropdown-list>
        </cds-combo-box>
      </div>
      <div class="col-4">
        <cds-combo-box
                #targetDefinitionComboBox
          [dropUp]="false"
          [appendInline]="true"
          [label]="'Target Definition' | translate"
          [placeholder]="'- ' + ('Target Definition' | translate) + ' -'"
          [items]="targetDefinitionItems"
          (selected)="onDefinitionSelected($event, 'target')"
        >
          <cds-dropdown-list></cds-dropdown-list>
        </cds-combo-box>
      </div>
      <div class="col-2">
        <cds-combo-box
                #targetVersionCombobox
          [dropUp]="false"
          [appendInline]="true"
          [label]="'Target Version' | translate"
          [placeholder]="'- ' + ('Target Version' | translate) + ' -'"
          [items]="targetVersionItems"
          (selected)="onVersionSelected($event, 'target')"
        >
          <cds-dropdown-list></cds-dropdown-list>
        </cds-combo-box>
      </div>
    </div>

    <div class="row mb-5">
      <div class="col-6">
        <valtimo-migration-process-diagram
          name="source"
          (loaded)="diagramLoaded($event)"
          #sourceDiagram
        ></valtimo-migration-process-diagram>
      </div>
      <div class="col-6">
        <valtimo-migration-process-diagram
          name="target"
          (loaded)="diagramLoaded($event)"
          #targetDiagram
        ></valtimo-migration-process-diagram>
      </div>
    </div>
    <table class="table table-striped mb-5" *ngIf="selectedId.source && selectedId.target">
      <tr *ngFor="let node of uniqueFlowNodeMap">
        <td>{{ node.name ? node.name : node.id }}</td>
        <td>
          <cds-combo-box
            [dropUp]="false"
            [appendInline]="true"
            [placeholder]="'- ' + ('Choose Target' | translate) + ' -'"
            [items]="getFilteredTargetFlowNodeMapItems(node)"
            (selected)="onTaskMappingSelected($event, node.id)"
          >
            <cds-dropdown-list></cds-dropdown-list>
          </cds-combo-box>
        </td>
      </tr>
    </table>
    <hr />
    <div class="btn-group mb-5">
      <button
        [disabled]="
          (uniqueFlowNodeMap.length !== taskMappingLength && uniqueFlowNodeMap.length > 0) ||
          !loaded.source ||
          !loaded.target
        "
        (click)="migrateProcess()"
        class="btn btn-primary"
      >
        Migrate
        <span *ngIf="processCount !== null" class="badge badge-pill badge-secondary">{{
          processCount
        }}</span>
      </button>
    </div>
  </div>
</div>
