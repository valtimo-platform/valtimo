<div class="process-migration">
  <cds-notification
    [notificationObj]="{
      type: 'warning',
      title: 'processMigration.warning.title' | translate,
      message: 'processMigration.warning.message' | translate,
      showClose: false,
      lowContrast: true,
    }"
  ></cds-notification>

  <div class="process-migration__selection">
    <cds-combo-box
      [appendInline]="true"
      [dropUp]="false"
      [items]="sourceDefinitionItems"
      [label]="'processMigration.sourceDefinition' | translate"
      [placeholder]="'processMigration.selectPlaceholder' | translate"
      (clear)="onSourceDefinitionClear($event)"
      (selected)="onDefinitionSelected($event, 'source')"
      [attr.data-test-id]="testIds.sourceDefinitionSelect"
    >
      <cds-dropdown-list></cds-dropdown-list>
    </cds-combo-box>

    <cds-combo-box
      #sourceVersionCombobox
      [appendInline]="true"
      [dropUp]="false"
      [items]="sourceVersionItems"
      [label]="'processMigration.sourceVersion' | translate"
      [placeholder]="'processMigration.selectPlaceholder' | translate"
      (selected)="onVersionSelected($event, 'source')"
      [attr.data-test-id]="testIds.sourceVersionSelect"
    >
      <cds-dropdown-list></cds-dropdown-list>
    </cds-combo-box>

    <cds-combo-box
      #targetDefinitionComboBox
      [appendInline]="true"
      [dropUp]="false"
      [items]="targetDefinitionItems"
      [label]="'processMigration.targetDefinition' | translate"
      [placeholder]="'processMigration.selectPlaceholder' | translate"
      (selected)="onDefinitionSelected($event, 'target')"
      [attr.data-test-id]="testIds.targetDefinitionSelect"
    >
      <cds-dropdown-list></cds-dropdown-list>
    </cds-combo-box>

    <cds-combo-box
      #targetVersionCombobox
      [appendInline]="true"
      [dropUp]="false"
      [items]="targetVersionItems"
      [label]="'processMigration.targetVersion' | translate"
      [placeholder]="'processMigration.selectPlaceholder' | translate"
      (selected)="onVersionSelected($event, 'target')"
      [attr.data-test-id]="testIds.targetVersionSelect"
    >
      <cds-dropdown-list></cds-dropdown-list>
    </cds-combo-box>
  </div>

  <div class="process-migration__diagrams">
    <valtimo-migration-process-diagram
      #sourceDiagram
      name="source"
      (loaded)="diagramLoaded($event)"
    ></valtimo-migration-process-diagram>

    <valtimo-migration-process-diagram
      #targetDiagram
      name="target"
      (loaded)="diagramLoaded($event)"
    ></valtimo-migration-process-diagram>
  </div>

  <cds-structured-list
    *ngIf="selectedId.source && selectedId.target && uniqueFlowNodeMap.length > 0"
    class="process-migration__mapping"
  >
    <cds-list-header>
      <cds-list-column>{{ 'processMigration.sourceActivity' | translate }}</cds-list-column>

      <cds-list-column>{{ 'processMigration.targetActivity' | translate }}</cds-list-column>
    </cds-list-header>

    <cds-list-row *ngFor="let node of uniqueFlowNodeMap">
      <cds-list-column>{{ node.name ? node.name : node.id }}</cds-list-column>

      <cds-list-column>
        <cds-combo-box
          [appendInline]="true"
          [dropUp]="false"
          [items]="getFilteredTargetFlowNodeMapItems(node)"
          [placeholder]="'processMigration.selectPlaceholder' | translate"
          (selected)="onTaskMappingSelected($event, node.id)"
          [attr.data-test-id]="testIds.activityMappingSelect"
        >
          <cds-dropdown-list></cds-dropdown-list>
        </cds-combo-box>
      </cds-list-column>
    </cds-list-row>
  </cds-structured-list>

  <div class="process-migration__actions">
    <button
      cdsButton="primary"
      [disabled]="
        (uniqueFlowNodeMap.length !== taskMappingLength && uniqueFlowNodeMap.length > 0) ||
        !loaded.source ||
        !loaded.target
      "
      (click)="migrateProcess()"
      [attr.data-test-id]="testIds.migrateButton"
    >
      {{ 'processMigration.migrate' | translate }}
    </button>

    <cds-tag
      *ngIf="processCount !== null"
      type="gray"
      [attr.data-test-id]="testIds.processInstanceCountTag"
      >{{ 'processMigration.instanceCount' | translate: {count: processCount} }}</cds-tag
    >
  </div>
</div>
