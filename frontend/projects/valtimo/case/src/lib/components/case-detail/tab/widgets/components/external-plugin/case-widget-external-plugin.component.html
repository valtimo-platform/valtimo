<div class="case-widget-external-plugin" [ngSwitch]="$state()">
  <div *ngSwitchCase="'loading'" class="case-widget-external-plugin__status">
    <cds-loading [isActive]="true" [overlay]="false" size="normal"></cds-loading>
  </div>

  <div
    *ngSwitchCase="'error'"
    class="case-widget-external-plugin__status case-widget-external-plugin__status--error"
  >
    {{ 'caseManagement.tabManagement.externalPlugin.loadError' | translate }}
  </div>

  <div *ngSwitchCase="'unavailable'" class="case-widget-external-plugin__status">
    {{ 'caseManagement.tabManagement.externalPlugin.unavailable' | translate }}
  </div>

  <ng-container *ngSwitchCase="'ready'">
    <div *ngIf="!$iframeReady()" class="case-widget-external-plugin__status">
      <cds-loading [isActive]="true" [overlay]="false" size="normal"></cds-loading>
    </div>

    <valtimo-external-plugin-iframe
      [allowedEndpoints]="sessionService.$allowedEndpoints()"
      [bundleUrl]="$content()!.bundleUrl!"
      [configurationId]="$content()!.configurationId"
      [context]="$content()!.context"
      [pluginDataUrl]="$pluginDataUrl()"
      [userToken]="sessionService.$userToken()"
      (readyEvent)="onIframeReady()"
    ></valtimo-external-plugin-iframe>
  </ng-container>
</div>
