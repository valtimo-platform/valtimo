<valtimo-carbon-list
  [actionItems]="ACTION_ITEMS"
  [fields]="$fields()"
  [items]="plans$ | async"
  [loading]="$loading()"
  (rowClicked)="onRowClicked($event)"
>
  <ng-container carbonToolbarContent>
    <button cdsButton="primary" [attr.data-test-id]="testIds.addButton" (click)="onAddPlan()">
      {{ 'buildingBlockManagement.migration.addPlan' | translate }}
    </button>
  </ng-container>

  <valtimo-no-results
    [title]="'buildingBlockManagement.migration.noResults.title' | translate"
    [description]="'buildingBlockManagement.migration.noResults.description' | translate"
  ></valtimo-no-results>
</valtimo-carbon-list>

<valtimo-confirmation-modal
  [confirmButtonTextTranslationKey]="'interface.delete'"
  [contentTranslationKey]="'buildingBlockManagement.migration.deleteModal.content'"
  [outputOnConfirm]="$planToDelete()"
  [showModalSubject$]="showDeleteModal$"
  [titleTranslationKey]="'buildingBlockManagement.migration.deleteModal.title'"
  (confirmEvent)="onDeleteConfirm($event)"
></valtimo-confirmation-modal>

<valtimo-building-block-migration-detail-modal
  [open]="$showDetailModal()"
  [plan]="$selectedPlan()"
  (closeEvent)="onCloseDetail()"
></valtimo-building-block-migration-detail-modal>

<ng-template #statusColumn let-data="data">
  <cds-tag class="cds-tag--no-margin" [type]="statusTagType(data.item.status.status)">
    {{ 'buildingBlockManagement.migration.status.' + data.item.status.status | translate }}
  </cds-tag>
</ng-template>

<ng-template #progressColumn let-data="data">
  <span class="migration-progress">{{ data.item.status.casesMigrated }}</span>
</ng-template>
