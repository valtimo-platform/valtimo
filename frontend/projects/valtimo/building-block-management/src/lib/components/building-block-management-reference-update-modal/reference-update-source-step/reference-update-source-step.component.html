<p class="valtimo-building-block-reference-update__description">
  {{ 'buildingBlockManagement.referenceUpdate.source.description' | translate }}
</p>

@if ($inUseVersions() === null) {
  <cds-loading size="sm" [isActive]="true"></cds-loading>
} @else if ($sourceKeyItems().length === 0) {
  <cds-inline-notification
    [attr.data-test-id]="testIds.noSourceVersions"
    [notificationObj]="{
      type: 'info',
      title: ('buildingBlockManagement.referenceUpdate.source.emptyTitle' | translate),
      message: ('buildingBlockManagement.referenceUpdate.source.emptyMessage' | translate),
      showClose: false,
      lowContrast: true,
    }"
  ></cds-inline-notification>
} @else {
  <div class="valtimo-building-block-reference-update__selectors">
    <cds-combo-box
      [appendInline]="false"
      [attr.data-test-id]="testIds.sourceKeyComboBox"
      [dropUp]="false"
      [items]="$sourceKeyItems()"
      [label]="'buildingBlockManagement.referenceUpdate.source.keyLabel' | translate"
      [placeholder]="'buildingBlockManagement.referenceUpdate.source.keyPlaceholder' | translate"
      (selected)="onSourceKeySelected($event)"
    >
      <cds-dropdown-list [listTpl]="keyTemplate"></cds-dropdown-list>
    </cds-combo-box>

    <cds-combo-box
      [appendInline]="false"
      [attr.data-test-id]="testIds.sourceVersionComboBox"
      [disabled]="$sourceKey() === null"
      [dropUp]="false"
      [items]="$sourceItems()"
      [label]="'buildingBlockManagement.referenceUpdate.source.versionLabel' | translate"
      [placeholder]="
        'buildingBlockManagement.referenceUpdate.source.versionPlaceholder' | translate
      "
      (selected)="onSourceSelected($event)"
    >
      <cds-dropdown-list [listTpl]="versionTemplate"></cds-dropdown-list>
    </cds-combo-box>
  </div>
}

<ng-template #keyTemplate let-item="item">
  <span [attr.data-test-id]="item?.['data-test-id']">{{ item?.content }}</span>
</ng-template>

<ng-template #versionTemplate let-item="item">
  <div
    [attr.data-test-id]="item?.['data-test-id']"
    class="valtimo-building-block-reference-update__version"
  >
    <span>{{ item?.content }}</span>

    <valtimo-building-block-reference-update-status-tag
      [final]="item?.final"
    ></valtimo-building-block-reference-update-status-tag>
  </div>
</ng-template>
