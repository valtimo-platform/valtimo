<div class="migration-tab">
  @if (descriptionKey) {
    <p class="migration-tab__description">{{ descriptionKey | translate }}</p>
  }

  <div class="migration-tab__items">
    @for (instruction of instructionsArray.controls; track instruction) {
      <div class="migration-tab__card">
        <div class="migration-tab__card-header">
          <!-- The whole header is the toggle: a suggested plan authorises every reachable block, and hunting a 16px target on each is the opposite of what collapsing is for. -->
          <button
            type="button"
            class="migration-tab__card-toggle"
            [attr.aria-expanded]="isExpanded(instruction)"
            [title]="
              (isExpanded(instruction) ? 'interface.collapse' : 'interface.expand') | translate
            "
            [attr.data-test-id]="testIds?.toggleBuildingBlockEntryButton"
            (click)="toggleExpanded(instruction)"
          >
            <svg
              [cdsIcon]="isExpanded(instruction) ? 'chevron--up' : 'chevron--down'"
              size="16"
            ></svg>

            <span class="migration-tab__card-index">#{{ $index + 1 }}</span>

            <span class="migration-tab__card-summary">
              {{ summaryOf(instruction) || ('migrationEditor.card.unnamed' | translate) }}
            </span>
          </button>

          <button
            cdsButton="danger--ghost"
            size="sm"
            [iconOnly]="true"
            [title]="'interface.delete' | translate"
            [attr.data-test-id]="testIds?.deleteBuildingBlockEntryButton"
            (click)="removeInstruction($index)"
          >
            <svg cdsIcon="trash-can" size="16" class="cds--btn__icon"></svg>
          </button>
        </div>

        @if (isExpanded(instruction)) {
          <valtimo-migration-building-block-entry
            [context]="entryContext"
            [dataMigration]="dataMigrationOf($index)"
            [group]="instruction"
            [keyItems]="keyItems"
            [processMigration]="processMigrationOf($index)"
            [suggesting]="isSuggesting(instruction)"
            (dataMigrationChange)="onDataMigrationChange($index, $event)"
            (processMigrationChange)="onProcessMigrationChange($index, $event)"
          ></valtimo-migration-building-block-entry>
        }
      </div>
    } @empty {
      <p class="migration-tab__empty">
        {{
          'migrationEditor.' + (isAdd ? 'addBuildingBlock' : 'removeBuildingBlock') + '.empty'
            | translate
        }}
      </p>
    }
  </div>

  <button
    cdsButton="tertiary"
    size="sm"
    [attr.data-test-id]="isAdd ? testIds.addBuildingBlockButton : testIds.removeBuildingBlockButton"
    (click)="addInstruction()"
  >
    {{
      'migrationEditor.' + (isAdd ? 'addBuildingBlock' : 'removeBuildingBlock') + '.addEntry'
        | translate
    }}
    <svg cdsIcon="add" size="16" class="cds--btn__icon"></svg>
  </button>
</div>
