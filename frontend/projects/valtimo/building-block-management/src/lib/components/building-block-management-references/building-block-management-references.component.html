<p class="valtimo-building-block-management-references__description">
  {{ 'buildingBlockManagement.references.description' | translate }}
</p>

<valtimo-carbon-list [fields]="$fields()" [items]="$references()" [loading]="$loading()">
  <div carbonToolbarContent>
    <button
      [attr.data-test-id]="testIds.updateReferencesButton"
      [disabled]="$loading() || $references().length === 0 || !(canUpdate$ | async)"
      cdsButton="primary"
      (click)="onUpdateReferencesClick()"
    >
      {{ 'buildingBlockManagement.references.updateButton' | translate }}

      <svg cdsIcon="migrate" size="16" class="cds--btn__icon"></svg>
    </button>
  </div>

  <valtimo-no-results
    [description]="'buildingBlockManagement.references.noResults.description' | translate"
    [title]="'buildingBlockManagement.references.noResults.title' | translate"
  ></valtimo-no-results>
</valtimo-carbon-list>

<ng-template #linkColumn let-data="data">
  <a [attr.data-test-id]="testIds.referenceLink" [routerLink]="data.item.linkRoute">
    {{ data.item.linkText }}
  </a>
</ng-template>

<valtimo-building-block-management-reference-update-modal></valtimo-building-block-management-reference-update-modal>
