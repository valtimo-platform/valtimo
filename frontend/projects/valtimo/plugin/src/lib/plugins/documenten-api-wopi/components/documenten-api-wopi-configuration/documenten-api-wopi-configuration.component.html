<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    documentenApiPluginSelectItems: documentenApiPluginSelectItems$ | async,
  } as obs"
>
  <v-input
    name="configurationTitle"
    data-test-id="documentenApiPreviewConfigurationTitle"
    [title]="'configurationTitle' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.configurationTitle"
    [required]="true"
    [trim]="true"
    [tooltip]="'configurationTitleTooltip' | pluginTranslate: pluginId | async"
    placeholder="Documenten API Preview Plugin"
  >
  </v-input>

  <v-input
    name="wopiClientDiscoveryUrl"
    data-test-id="wopiClientDiscoveryUrl"
    [title]="'wopiClientDiscoveryUrl' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.wopiClientDiscoveryUrl"
    [required]="true"
    [trim]="true"
    [tooltip]="'wopiClientDiscoveryUrlTooltip' | pluginTranslate: pluginId | async"
    placeholder="https://wopiclient.example.com/hosting/discovery/"
  >
  </v-input>

  <v-select
    [loading]="!obs.documentenApiPluginSelectItems"
    [items]="obs.documentenApiPluginSelectItems"
    [margin]="true"
    name="documentenApiConfigurationId"
    data-test-id="documentenWopiDocumentenApiPluginConfiguration"
    [title]="'documentenApiPluginConfiguration' | pluginTranslate: pluginId | async"
    [disabled]="obs.disabled"
    [defaultSelectionId]="obs.prefill?.documentenApiConfigurationId"
    [required]="true"
    [tooltip]="'documentenApiPluginConfigurationTooltip' | pluginTranslate: pluginId | async"
  ></v-select>

</v-form>
