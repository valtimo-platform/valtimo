<ng-container
  *ngIf="{
    apps: apps$ | async,
    refreshing: appsRefreshing$ | async,
  } as appObs"
>
  <valtimo-carbon-list
    [loading]="appsLoading$ | async"
    [items]="appObs.apps"
    [fields]="appFields"
    [actionItems]="appActionItems"
    [header]="false"
    (rowClicked)="onRowClicked($event)"
  >
    <ng-container carbonToolbarContent>
      <cds-loading
        *ngIf="appObs.refreshing"
        size="sm"
        [isActive]="true"
        class="plugin-apps-page__spinner"
      ></cds-loading>

      <button cdsButton="primary" [disabled]="appsLoading$ | async" (click)="openAddModal()">
        {{ 'pluginManagement.addApp' | translate }}

        <svg cdsIcon="add" size="16" class="cds--btn__icon"></svg>
      </button>
    </ng-container>

    <valtimo-no-results
      [action]="addAppButton"
      [title]="'pluginManagement.noApps' | translate"
    ></valtimo-no-results>
  </valtimo-carbon-list>

  <ng-template #addAppButton>
    <button cdsButton="primary" [disabled]="appsLoading$ | async" (click)="openAddModal()">
      {{ 'pluginManagement.addApp' | translate }}

      <svg cdsIcon="add" size="16" class="cds--btn__icon"></svg>
    </button>
  </ng-template>
</ng-container>

<valtimo-plugin-app-add-modal
  [open]="$addModalOpen()"
  [resumeHostId]="$resumeHostId()"
  (closeEvent)="onAddModalClose()"
  (completedEvent)="onAddModalCompleted()"
></valtimo-plugin-app-add-modal>

<valtimo-plugin-external-edit-modal
  [open]="$editModalOpen()"
  [configuration]="$selectedConfiguration()"
  (closeEvent)="closeEditModal()"
  (savedEvent)="onConfigurationSaved()"
  (deleteEvent)="onConfigurationDeleteRequested($event)"
></valtimo-plugin-external-edit-modal>

<valtimo-plugin-host-event-queue-modal
  [host]="hostToEditEventQueue$ | async"
  [open]="eventQueueModalOpen$ | async"
  variant="app"
  (closeEvent)="closeEventQueueModal()"
  (submitEvent)="submitEventQueueUpdate($event)"
></valtimo-plugin-host-event-queue-modal>

<valtimo-plugin-host-edit-modal
  [errorMessage]="editConnectionErrorMessage$ | async"
  [host]="hostToEditConnection$ | async"
  [open]="editConnectionModalOpen$ | async"
  [submitting]="editConnectionSubmitting$ | async"
  [variant]="'app'"
  (closeEvent)="closeEditConnectionModal()"
  (submitEvent)="submitConnectionUpdate($event)"
></valtimo-plugin-host-edit-modal>

<valtimo-plugin-host-frontend-origins-modal
  [host]="hostToEditFrontendOrigins$ | async"
  [open]="frontendOriginsModalOpen$ | async"
  (closeEvent)="closeFrontendOriginsModal()"
  (submitEvent)="submitFrontendOriginsUpdate($event)"
></valtimo-plugin-host-frontend-origins-modal>

<valtimo-confirmation-modal
  [showModalSubject$]="reloadModalOpen$"
  [titleTranslationKey]="'pluginManagement.reloadModal.title'"
  [contentTranslationKey]="'pluginManagement.reloadModal.description'"
  [confirmButtonTextTranslationKey]="'pluginManagement.reloadModal.reload'"
  [cancelButtonTextTranslationKey]="'pluginManagement.reloadModal.later'"
  (confirmEvent)="confirmReload()"
  (cancelEvent)="cancelReload()"
></valtimo-confirmation-modal>

<valtimo-plugin-log-modal
  [open]="$logModalOpen()"
  [configurationId]="$logConfigurationId()"
  [configurationTitle]="$logConfigurationTitle()"
  (closeModal)="closeLogModal()"
></valtimo-plugin-log-modal>

<valtimo-confirmation-modal
  [showModalSubject$]="refreshModalOpen$"
  [titleTranslationKey]="'pluginManagement.appAdd.refreshModal.title'"
  [contentTranslationKey]="'pluginManagement.appAdd.refreshModal.description'"
  [confirmButtonTextTranslationKey]="'pluginManagement.appAdd.refreshModal.confirm'"
  [cancelButtonTextTranslationKey]="'pluginManagement.appAdd.refreshModal.cancel'"
  (confirmEvent)="onRefreshConfirm()"
  (cancelEvent)="onRefreshCancel()"
></valtimo-confirmation-modal>

<valtimo-confirmation-modal
  [showModalSubject$]="deleteConfigurationModalOpen$"
  [titleTranslationKey]="'pluginManagement.deleteConfigurationModal.title'"
  [contentTranslationKey]="'pluginManagement.deleteConfigurationModal.description'"
  [confirmButtonTextTranslationKey]="'interface.delete'"
  [confirmButtonType]="'danger'"
  [cancelButtonTextTranslationKey]="'interface.cancel'"
  (confirmEvent)="confirmDeleteConfiguration()"
  (cancelEvent)="cancelDeleteConfiguration()"
></valtimo-confirmation-modal>

<valtimo-confirmation-modal
  [showModalSubject$]="deleteHostModalOpen$"
  [titleTranslationKey]="'pluginManagement.deleteHostModal.title'"
  [contentTranslationKey]="'pluginManagement.deleteHostModal.description'"
  [confirmButtonTextTranslationKey]="'interface.delete'"
  [confirmButtonType]="'danger'"
  [cancelButtonTextTranslationKey]="'interface.cancel'"
  (confirmEvent)="confirmDeleteHost()"
  (cancelEvent)="cancelDeleteHost()"
></valtimo-confirmation-modal>

<valtimo-plugin-usage-modal
  [descriptionTranslationKey]="usageModalDescriptionKey"
  [entityName]="usageModalEntityName"
  [open]="usageModalOpen$ | async"
  [titleTranslationKey]="usageModalTitleKey"
  [usages]="usageModalUsages$ | async"
  (closeEvent)="closeUsageModal()"
></valtimo-plugin-usage-modal>
