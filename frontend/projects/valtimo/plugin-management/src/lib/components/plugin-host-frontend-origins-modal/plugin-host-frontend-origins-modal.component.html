<cds-modal *ngIf="open && host" [open]="open" size="sm" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    <h3 cdsModalHeaderHeading>
      {{ 'pluginManagement.editHostFrontendOriginsModalTitle' | translate: {name: host.name} }}
    </h3>
  </cds-modal-header>

  <form
    [formGroup]="form"
    cdsModalContent
    [cdsLayer]="1"
    class="plugin-host-frontend-origins-modal__content"
  >
    <div formArrayName="frontendOrigins">
      <div
        *ngFor="let originControl of originControls; let i = index"
        class="plugin-host-frontend-origins-modal__row"
      >
        <input cdsText [formControlName]="i" placeholder="https://valtimo.example.com" />

        <button cdsButton="ghost" type="button" (click)="removeOrigin(i)">
          {{ 'interface.delete' | translate }}
        </button>
      </div>
    </div>

    <button cdsButton="ghost" type="button" (click)="addOrigin()">
      {{ 'pluginManagement.addFrontendOrigin' | translate }}
    </button>

    <small>{{ 'pluginManagement.hints.frontendOrigins' | translate }}</small>

    <small *ngIf="originControls.length === 0">
      {{ 'pluginManagement.hints.noFrontendOrigins' | translate }}
    </small>
  </form>

  <cds-modal-footer>
    <button cdsButton="secondary" (click)="onClose()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button cdsButton="primary" [disabled]="form.invalid" (click)="onSubmit()">
      {{ 'pluginManagement.saveFrontendOrigins' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
