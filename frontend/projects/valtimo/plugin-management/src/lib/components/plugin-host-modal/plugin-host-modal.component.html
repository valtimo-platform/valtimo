<cds-modal *ngIf="open" [open]="open" size="sm" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    <h3 cdsModalHeaderHeading>
      <ng-container *ngIf="isEdit; else addTitle">
        {{ 'pluginManagement.editHostConnectionModalTitle' | translate: {name: host?.name} }}
      </ng-container>

      <ng-template #addTitle>
        {{ (isApp ? 'pluginManagement.addApp' : 'pluginManagement.addHost') | translate }}
      </ng-template>
    </h3>
  </cds-modal-header>

  <div cdsModalContent class="plugin-host-modal__content">
    <cds-inline-notification
      *ngIf="errorNotification$ | async as errorNotification"
      [notificationObj]="errorNotification"
    ></cds-inline-notification>

    <valtimo-plugin-host-connection-form
      [active]="open"
      [host]="host"
      [variant]="isApp ? 'app' : 'host'"
      (validChange)="onFormValidChange($event)"
    ></valtimo-plugin-host-connection-form>
  </div>

  <cds-modal-footer>
    <cds-loading
      *ngIf="submitting"
      size="sm"
      [isActive]="true"
      class="plugin-host-modal__spinner"
    ></cds-loading>

    <button
      cdsButton="secondary"
      [disabled]="submitting"
      (click)="onClose()"
      [attr.data-test-id]="testIds.cancelButton"
    >
      {{ 'interface.cancel' | translate }}
    </button>

    <button
      cdsButton="primary"
      [disabled]="!formValid || submitting"
      (click)="onSubmit()"
      [attr.data-test-id]="testIds.saveButton"
    >
      {{ (isEdit ? 'pluginManagement.saveConnection' : 'interface.save') | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
