<cds-loading *ngIf="$loading()" [isActive]="true" size="sm"></cds-loading>

<ng-container *ngIf="!$loading()">
  <ng-container *ngIf="$configBundleUrl() as bundleUrl; else propertiesForm">
    <valtimo-external-plugin-iframe
      [bundleUrl]="bundleUrl"
      [autoHeight]="true"
      (configurationChangedEvent)="onIframeConfigurationChanged($event)"
    ></valtimo-external-plugin-iframe>
  </ng-container>

  <ng-template #propertiesForm>
    <form [formGroup]="form">
      <div class="cds--form-item">
        <v-input-label
          [required]="true"
          titleTranslationKey="pluginManagement.labels.configurationName"
        ></v-input-label>

        <input
          [placeholder]="'pluginManagement.propertiesEditor.titlePlaceholder' | translate"
          class="cds--text-input"
          formControlName="title"
        />
      </div>

      <valtimo-external-plugin-config-form
        *ngIf="$configStructure() as structure; else jsonEditor"
        [structure]="structure"
        [value]="$initialProperties()"
        (validEvent)="onGeneratedPropertiesValid($event)"
        (valueChangeEvent)="onGeneratedPropertiesChange($event)"
        class="plugin-external-configure__properties"
      ></valtimo-external-plugin-config-form>

      <ng-template #jsonEditor>
        <valtimo-plugin-external-properties-editor
          [invalid]="$propertiesInvalid()"
          [schema]="$configurationSchema()"
          [value]="form.controls.properties.value ?? '{}'"
          (valueChange)="form.controls.properties.setValue($event)"
          class="plugin-external-configure__properties"
        ></valtimo-plugin-external-properties-editor>
      </ng-template>
    </form>
  </ng-template>
</ng-container>
