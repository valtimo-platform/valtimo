<cds-modal *ngIf="open" [open]="open" size="md" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    {{ 'pluginManagement.review.modalTitle' | translate }}
  </cds-modal-header>

  <section cdsModalContent>
    <cds-loading *ngIf="$loading()" [isActive]="true" size="sm"></cds-loading>

    <ng-container *ngIf="!$loading()">
      <cds-inline-notification
        *ngIf="$errorMessage() as errorMessage"
        [notificationObj]="{
          type: 'error',
          title: ('pluginManagement.review.failed' | translate),
          message: errorMessage,
          showClose: false,
          lowContrast: true,
        }"
        class="plugin-external-review-modal__notification"
      ></cds-inline-notification>

      <valtimo-plugin-external-permissions
        [capabilities]="$pendingCapabilities()"
        [egress]="$pendingEgress()"
        [endpoints]="$pendingEndpoints()"
        [eventSubscriptions]="$pendingEvents()"
        (validEvent)="onPermissionsValid($event)"
      ></valtimo-plugin-external-permissions>
    </ng-container>
  </section>

  <cds-modal-footer>
    <button
      cdsButton="secondary"
      [disabled]="$loading()"
      (click)="onClose()"
      [attr.data-test-id]="testIds.cancelButton"
    >
      {{ 'interface.cancel' | translate }}
    </button>

    <button
      cdsButton="primary"
      [disabled]="!$permissionsValid() || $loading()"
      (click)="onAccept()"
      [attr.data-test-id]="testIds.acceptButton"
    >
      {{ 'pluginManagement.review.accept' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
