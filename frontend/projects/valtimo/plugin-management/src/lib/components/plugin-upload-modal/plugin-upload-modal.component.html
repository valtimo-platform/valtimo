<cds-modal *ngIf="open" [open]="open" size="sm" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    <h3 cdsModalHeaderHeading>{{ 'pluginManagement.uploadPlugin' | translate }}</h3>
  </cds-modal-header>

  <section cdsModalContent [cdsLayer]="1" class="plugin-upload-modal__content">
    <cds-dropdown
      [appendInline]="true"
      [label]="'pluginManagement.labels.pluginHost' | translate"
      [placeholder]="'pluginManagement.selectHost' | translate"
      (selected)="onHostSelected($event)"
    >
      <cds-dropdown-list [items]="$hostItems()"></cds-dropdown-list>
    </cds-dropdown>

    <div [formGroup]="_fileForm">
      <cds-file-uploader
        [accept]="['zip']"
        [buttonText]="'pluginManagement.upload.buttonText' | translate"
        [description]="'pluginManagement.upload.description' | translate"
        [disabled]="$uploading()"
        [multiple]="false"
        [title]="'pluginManagement.upload.title' | translate"
        buttonType="primary"
        formControlName="file"
      >
      </cds-file-uploader>
    </div>

    <cds-inline-notification
      *ngIf="$uploadNotification() as uploadNotification"
      [notificationObj]="uploadNotification"
    ></cds-inline-notification>
  </section>

  <cds-modal-footer>
    <button cdsButton="secondary" [disabled]="$uploading()" (click)="onClose()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button
      cdsButton="primary"
      [disabled]="!$selectedHostId() || !$fileSelected() || $fileTooLarge() || $uploading()"
      (click)="onUpload()"
    >
      <cds-loading *ngIf="$uploading()" [isActive]="true" size="sm"></cds-loading>
      {{ 'interface.upload' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>

<valtimo-confirmation-modal
  [showModalSubject$]="_compatibilityModalOpen$"
  [titleTranslationKey]="'pluginManagement.compatibility.uploadWarningTitle'"
  [content]="$compatibilityWarning()"
  [confirmButtonTextTranslationKey]="'pluginManagement.compatibility.uploadAnyway'"
  [cancelButtonTextTranslationKey]="'interface.cancel'"
  (confirmEvent)="onConfirmIncompatibleUpload()"
  (cancelEvent)="onCancelIncompatibleUpload()"
></valtimo-confirmation-modal>

<cds-modal *ngIf="$overwriteReview() as overwriteReview" [open]="true" size="md" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onCancelOverwrite()">
    <h3 cdsModalHeaderHeading>
      {{ 'pluginManagement.upload.overwriteTitle' | translate }}
    </h3>
  </cds-modal-header>

  <section cdsModalContent [cdsLayer]="1" class="plugin-upload-modal__overwrite-content">
    <cds-inline-notification [notificationObj]="overwriteReview.warning"></cds-inline-notification>

    <valtimo-plugin-external-permissions
      [capabilities]="overwriteReview.capabilities"
      [endpoints]="overwriteReview.endpoints"
      [eventSubscriptions]="overwriteReview.eventSubscriptions"
      [egress]="overwriteReview.egress"
      (validEvent)="onOverwriteValidityChange($event)"
    ></valtimo-plugin-external-permissions>
  </section>

  <cds-modal-footer>
    <button cdsButton="secondary" [disabled]="$uploading()" (click)="onCancelOverwrite()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button
      cdsButton="danger"
      [disabled]="!$overwriteAcknowledged() || $uploading()"
      (click)="onConfirmOverwrite()"
    >
      {{ 'pluginManagement.upload.overwriteConfirm' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
