<cds-modal *ngIf="open" [open]="open" size="sm" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    <h3 cdsModalHeaderHeading>
      {{
        (variant === 'app'
          ? 'pluginManagement.editHost.modalTitleApp'
          : 'pluginManagement.editHost.modalTitle'
        ) | translate
      }}
    </h3>
  </cds-modal-header>

  <div cdsModalContent class="plugin-host-edit-modal__content">
    <cds-inline-notification
      *ngIf="errorNotification$ | async as errorNotification"
      [notificationObj]="errorNotification"
    ></cds-inline-notification>

    <valtimo-plugin-host-connection-form
      [active]="open"
      [editHost]="host"
      [variant]="variant"
      (validChange)="onFormValidChange($event)"
    ></valtimo-plugin-host-connection-form>

    <cds-inline-notification
      *ngIf="$secretChanged() && (secretWarning$ | async) as secretWarning"
      [notificationObj]="secretWarning"
    ></cds-inline-notification>

    <cds-inline-notification
      *ngIf="$brokerChanged() && (brokerNote$ | async) as brokerNote"
      [notificationObj]="brokerNote"
    ></cds-inline-notification>
  </div>

  <cds-modal-footer>
    <cds-loading
      *ngIf="submitting"
      size="sm"
      [isActive]="true"
      class="plugin-host-edit-modal__spinner"
    ></cds-loading>

    <button cdsButton="secondary" [disabled]="submitting" (click)="onClose()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button cdsButton="primary" [disabled]="!formValid || submitting" (click)="onSubmit()">
      {{ 'interface.save' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
