<cds-modal *ngIf="open" [open]="open" size="md" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    {{ configuration?.title }} - {{ $definitionName() }}

    <cds-progress-indicator
      *ngIf="progressSteps.length > 1"
      [current]="currentStepIndex"
      [steps]="progressSteps"
      class="plugin-external-edit-modal__progress"
      spacing="equal"
    ></cds-progress-indicator>
  </cds-modal-header>

  <section cdsModalContent>
    <cds-loading *ngIf="$loading()" [isActive]="true" size="sm"></cds-loading>

    <cds-inline-notification
      *ngIf="$saveError() as saveError"
      [attr.data-test-id]="testIds.saveError"
      [notificationObj]="{
        type: 'error',
        title: ('pluginManagement.saveFailed' | translate),
        message: saveError,
        showClose: false,
        lowContrast: true,
      }"
      class="plugin-external-edit-modal__notification"
    ></cds-inline-notification>

    <div [hidden]="currentStepIndex !== 0 || $loading()">
      <ng-container *ngIf="!$loading()">
        <cds-inline-notification
          *ngIf="$awaitingHost(); else editableConfiguration"
          [notificationObj]="{
            type: 'info',
            title: ('pluginManagement.awaitingHost.modalTitle' | translate),
            message: ('pluginManagement.awaitingHost.modalMessage' | translate),
            showClose: false,
            lowContrast: true,
          }"
          class="plugin-external-edit-modal__notification"
        ></cds-inline-notification>

        <ng-template #editableConfiguration>
          <ng-container *ngIf="$configBundleUrl() as bundleUrl; else jsonForm">
            <valtimo-external-plugin-iframe
              [bundleUrl]="bundleUrl"
              [autoHeight]="true"
              [prefillConfiguration]="$prefillConfiguration()"
              (configurationChangedEvent)="onIframeConfigurationChanged($event)"
            ></valtimo-external-plugin-iframe>
          </ng-container>

          <ng-template #jsonForm>
            <form [formGroup]="_form">
              <div class="cds--form-item">
                <label class="cds--label">{{
                  'pluginManagement.labels.configurationName' | translate
                }}</label>

                <input class="cds--text-input" formControlName="title" />
              </div>

              <valtimo-plugin-external-properties-editor
                [invalid]="$propertiesInvalid()"
                [schema]="$configurationSchema()"
                [secretsKeptWhenEmpty]="true"
                [value]="_form.controls.properties.value ?? '{}'"
                (valueChange)="_form.controls.properties.setValue($event)"
                class="plugin-external-edit-modal__section"
              ></valtimo-plugin-external-properties-editor>
            </form>
          </ng-template>
        </ng-template>

        <valtimo-plugin-external-provided-contracts
          *ngIf="!$hasPermissionsStep() && $providedContracts().length > 0"
          [providedContracts]="$providedContracts()"
          class="plugin-external-edit-modal__section"
        ></valtimo-plugin-external-provided-contracts>
      </ng-container>
    </div>

    <div *ngIf="$hasPermissionsStep()" [hidden]="currentStepIndex !== 1">
      <valtimo-plugin-external-contract-bindings
        [contracts]="$declaredContracts()"
        [currentBindings]="$currentBindings()"
        [selfConfigurationId]="configuration?.id ?? null"
        (bindingsChangeEvent)="onContractBindingsChange($event)"
        (validEvent)="onContractBindingsValid($event)"
      ></valtimo-plugin-external-contract-bindings>

      <valtimo-plugin-external-permissions
        [capabilities]="$capabilities()"
        [derivedEgress]="$derivedEgress()"
        [egress]="$egress()"
        [endpoints]="$endpoints()"
        [eventSubscriptions]="$eventSubscriptions()"
        [providedContracts]="$providedContracts()"
        [readonlyMode]="true"
        (validEvent)="onPermissionsValid($event)"
      ></valtimo-plugin-external-permissions>
    </div>
  </section>

  <cds-modal-footer>
    <button
      cdsButton="danger"
      [attr.data-test-id]="testIds.deleteButton"
      [disabled]="$loading()"
      (click)="onDelete()"
    >
      {{ 'pluginManagement.remove' | translate }}
    </button>

    <button
      *ngIf="currentStepIndex === 0 && $hasPermissionsStep() && !$awaitingHost()"
      cdsButton="primary"
      [attr.data-test-id]="testIds.nextButton"
      [disabled]="!configValid || $loading()"
      (click)="goToNextStep()"
    >
      {{ 'pluginManagement.editSteps.step1' | translate }}
    </button>

    <button
      *ngIf="
        (currentStepIndex === 0 && !$hasPermissionsStep() && !$awaitingHost()) ||
        (currentStepIndex === 1 && $hasPermissionsStep())
      "
      cdsButton="primary"
      [attr.data-test-id]="testIds.saveButton"
      [disabled]="!canSave"
      (click)="onSave()"
    >
      {{ 'pluginManagement.editSteps.save' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
