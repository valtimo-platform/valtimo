<cds-modal *ngIf="open" [open]="open" size="md" valtimoCdsModal>
  <cds-modal-header (closeSelect)="onClose()">
    {{ configuration?.title }} - {{ $definitionName() }}

    <cds-progress-indicator
      *ngIf="progressSteps.length > 1"
      [steps]="progressSteps"
      [current]="currentStepIndex"
      spacing="equal"
      class="plugin-external-edit-modal__progress"
    ></cds-progress-indicator>
  </cds-modal-header>

  <section cdsModalContent>
    <cds-loading *ngIf="$loading()" [isActive]="true" size="sm"></cds-loading>

    <div [hidden]="currentStepIndex !== 0 || $loading()">
      <ng-container *ngIf="!$loading()">
        <cds-inline-notification
          *ngIf="$awaitingHost(); else editableConfiguration"
          [notificationObj]="{
            type: 'info',
            title: ('pluginManagement.awaitingHost.modalTitle' | translate),
            message: ('pluginManagement.awaitingHost.modalMessage' | translate),
            showClose: false,
            lowContrast: true,
          }"
          class="plugin-external-edit-modal__awaiting-host"
        ></cds-inline-notification>

        <ng-template #editableConfiguration>
          <ng-container *ngIf="$configBundleUrl() as bundleUrl; else jsonForm">
            <valtimo-external-plugin-iframe
              [bundleUrl]="bundleUrl"
              [prefillConfiguration]="$prefillConfiguration()"
              (configurationChangedEvent)="onIframeConfigurationChanged($event)"
            ></valtimo-external-plugin-iframe>
          </ng-container>

          <ng-template #jsonForm>
            <form [formGroup]="_form">
              <div class="cds--form-item">
                <label class="cds--label">{{
                  'pluginManagement.labels.configurationName' | translate
                }}</label>
                <input class="cds--text-input" formControlName="title" />
              </div>

              <div class="cds--form-item">
                <label class="cds--label">{{
                  'pluginManagement.labels.properties' | translate
                }}</label>

                <textarea
                  class="cds--text-area plugin-external-edit-modal__properties-textarea"
                  formControlName="properties"
                  rows="12"
                ></textarea>

                <div *ngIf="$propertiesInvalid()" class="cds--form-requirement">
                  {{ 'pluginManagement.invalidJson' | translate }}
                </div>
              </div>
            </form>
          </ng-template>
        </ng-template>
      </ng-container>
    </div>

    <div *ngIf="$hasPermissionsStep()" [hidden]="currentStepIndex !== 1">
      <valtimo-plugin-external-permissions
        [endpoints]="$endpoints()"
        [eventSubscriptions]="$eventSubscriptions()"
        [capabilities]="$capabilities()"
        [egress]="$egress()"
        [derivedEgress]="$derivedEgress()"
        [readonlyMode]="true"
        (validEvent)="onPermissionsValid($event)"
      ></valtimo-plugin-external-permissions>
    </div>
  </section>

  <cds-modal-footer>
    <button cdsButton="danger" [disabled]="$loading()" (click)="onDelete()">
      {{ 'pluginManagement.remove' | translate }}
    </button>

    <button
      *ngIf="currentStepIndex === 0 && $hasPermissionsStep() && !$awaitingHost()"
      cdsButton="primary"
      [disabled]="$loading()"
      (click)="goToNextStep()"
    >
      {{ 'pluginManagement.editSteps.step1' | translate }}
    </button>

    <button
      *ngIf="currentStepIndex === 0 && !$hasPermissionsStep() && !$awaitingHost()"
      cdsButton="primary"
      [disabled]="!configValid || $loading()"
      (click)="onSave()"
    >
      {{ 'pluginManagement.editSteps.save' | translate }}
    </button>

    <button
      *ngIf="currentStepIndex === 1 && $hasPermissionsStep()"
      cdsButton="primary"
      [disabled]="!$permissionsValid() || $loading()"
      (click)="onSave()"
    >
      {{ 'pluginManagement.editSteps.save' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
