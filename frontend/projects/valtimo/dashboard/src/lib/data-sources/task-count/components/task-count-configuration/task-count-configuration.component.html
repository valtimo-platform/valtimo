<div class="task-count-configuration-form">
  <div class="form__element">
    <cds-dropdown
      [appendInline]="true"
      [attr.data-test-id]="testIds.caseDefinitionDropdown"
      [disabled]="$disabled()"
      [helperText]="'caseDefinitionNameHelperText' | widgetTranslate: dataSourceKey | async"
      [label]="'caseDefinitionName' | widgetTranslate: dataSourceKey | async"
      (selected)="caseDefinitionSelected($event)"
    >
      <cds-dropdown-list [items]="(caseDefinitionItems$ | async) || []"></cds-dropdown-list>
    </cds-dropdown>
  </div>

  @if (hasUnsupportedConditions$ | async) {
    <div class="form__element">
      <cds-inline-notification
        [notificationObj]="unsupportedConditionsNotification$ | async"
      ></cds-inline-notification>
    </div>
  }

  <cds-label
    [helperText]="'conditionsHelperText' | widgetTranslate: dataSourceKey | async"
    class="conditions-label"
    >{{ 'conditions' | widgetTranslate: dataSourceKey | async }}</cds-label
  >

  <valtimo-task-count-condition-group
    [dataSourceKey]="dataSourceKey"
    [disabled]="$disabled()"
    [group]="conditionsForm"
    [operatorItems]="(operatorItems$ | async) || []"
    [root]="true"
  ></valtimo-task-count-condition-group>
</div>
