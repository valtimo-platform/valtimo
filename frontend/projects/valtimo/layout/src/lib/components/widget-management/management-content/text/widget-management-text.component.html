<form [formGroup]="form" class="valtimo-widget-management-text__form">
  <section class="valtimo-widget-management-text__panel">
    <div class="valtimo-widget-management-text__identity-row">
      <cds-text-label class="valtimo-widget-management-text__title-input">
        <v-input-label
          [title]="'widgetTabManagement.content.widgetTitle' | translate"
          [tooltip]="'widgetTabManagement.content.widgetTitleTooltip' | translate"
        ></v-input-label>

        <input
          formControlName="widgetTitle"
          cdsText
          type="text"
          [placeholder]="'widgetTabManagement.content.widgetTitlePlaceholder' | translate"
        />
      </cds-text-label>

      <valtimo-mdi-icon-selector
        [cdsLayer]="1"
        formControlName="widgetIcon"
      ></valtimo-mdi-icon-selector>
    </div>
  </section>

  <ng-content></ng-content>

  <section class="valtimo-widget-management-text__panel">
    <cds-textarea-label>
      <v-input-label
        [title]="'widgetTabManagement.content.text.content' | translate"
        [tooltip]="'widgetTabManagement.content.text.contentTooltip' | translate"
      ></v-input-label>

      <textarea
        cdsTextArea
        formControlName="content"
        [rows]="12"
        [placeholder]="'widgetTabManagement.content.text.contentPlaceholder' | translate"
      ></textarea>
    </cds-textarea-label>

    <span class="valtimo-widget-management-text__helper">
      {{ 'widgetTabManagement.content.text.contentHelper' | translate }}
    </span>

    <cds-dropdown
      class="valtimo-widget-management-text__color"
      [label]="'widgetTabManagement.content.text.accentColor' | translate"
      [dropUp]="false"
      (selected)="onColorSelected($event)"
    >
      <cds-dropdown-list
        [items]="$colorItems()"
        [listTpl]="colorDropdownItemTemplate"
      ></cds-dropdown-list>
    </cds-dropdown>
  </section>
</form>

<ng-template #colorDropdownItemTemplate let-item="item">
  <ng-container *ngIf="item && item.content">
    <cds-tag
      *ngIf="item.tagType; else customColorTag"
      class="cds-tag--no-margin"
      [type]="item.tagType"
    >
      {{ item.content }}
    </cds-tag>
    <ng-template #customColorTag>
      <cds-tag
        class="cds-tag--no-margin valtimo-widget-management-text__color-tag"
        [style.--widget-color-tag-bg]="item.tagBackground"
        [style.--widget-color-tag-fg]="item.tagText"
      >
        {{ item.content }}
      </cds-tag>
    </ng-template>
  </ng-container>
</ng-template>
