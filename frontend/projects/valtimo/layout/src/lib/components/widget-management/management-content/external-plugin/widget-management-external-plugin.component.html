<form class="valtimo-widget-management-external-plugin" [formGroup]="form">
  <div class="valtimo-widget-management-external-plugin__title-container">
    <cds-text-label class="valtimo-widget-management-external-plugin__title-input">
      <v-input-label
        [title]="'widgetTabManagement.content.widgetTitle' | translate"
        [tooltip]="'widgetTabManagement.content.widgetTitleTooltip' | translate"
      >
      </v-input-label>

      <input
        cdsText
        formControlName="widgetTitle"
        [placeholder]="'widgetTabManagement.content.widgetTitlePlaceholder' | translate"
        type="text"
      />
    </cds-text-label>

    <valtimo-mdi-icon-selector
      [cdsLayer]="0"
      formControlName="widgetIcon"
    ></valtimo-mdi-icon-selector>
  </div>

  <ng-content></ng-content>

  <ng-container *ngIf="$tokenAvailable(); else pluginUnavailable">
    <cds-combo-box
      [cdsLayer]="1"
      [dropUp]="false"
      [items]="$configItems()"
      itemValueKey="configId"
      [label]="'widgetTabManagement.content.externalPlugin.configLabel' | translate"
      [placeholder]="'widgetTabManagement.content.externalPlugin.configPlaceholder' | translate"
      (selected)="onConfigSelected($event)"
    >
      <cds-dropdown-list [cdsLayer]="1"></cds-dropdown-list>
    </cds-combo-box>

    <cds-combo-box
      *ngIf="$showBundleSelect()"
      [cdsLayer]="1"
      [dropUp]="false"
      [items]="$bundleItems()"
      itemValueKey="bundleKey"
      [label]="'widgetTabManagement.content.externalPlugin.bundleLabel' | translate"
      [placeholder]="'widgetTabManagement.content.externalPlugin.bundlePlaceholder' | translate"
      (selected)="onBundleSelected($event)"
    >
      <cds-dropdown-list [cdsLayer]="1"></cds-dropdown-list>
    </cds-combo-box>
  </ng-container>

  <ng-template #pluginUnavailable>
    <p class="valtimo-widget-management-external-plugin__unavailable">
      {{ 'widgetTabManagement.content.externalPlugin.unavailableMessage' | translate }}
    </p>
  </ng-template>
</form>
