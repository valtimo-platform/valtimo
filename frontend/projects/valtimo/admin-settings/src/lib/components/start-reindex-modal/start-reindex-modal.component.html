<cds-modal valtimoCdsModal [open]="open" size="sm" (close)="onCancel()">
  <cds-modal-header [showCloseButton]="true" (closeSelect)="onCancel()">
    <h3 cdsModalHeaderHeading>{{ 'adminSettings.opensearch.reindex.startModalTitle' | translate }}</h3>
  </cds-modal-header>

  <section cdsModalContent [cdsLayer]="1" [formGroup]="formGroup" class="start-reindex-form">
    <cds-checkbox formControlName="pruneOrphans">
      <span class="label-with-tooltip">
        {{ 'adminSettings.opensearch.reindex.pruneOrphans' | translate }}
        <v-tooltip-icon [tooltip]="'adminSettings.opensearch.reindex.tooltips.pruneOrphans' | translate"></v-tooltip-icon>
      </span>
    </cds-checkbox>

    <cds-dropdown
      [label]="'adminSettings.opensearch.reindex.documentDefinitionName' | translate"
      [placeholder]="'adminSettings.opensearch.reindex.documentDefinitionPlaceholder' | translate"
      formControlName="documentDefinitionName"
    >
      <cds-dropdown-list [items]="documentDefinitions"></cds-dropdown-list>
    </cds-dropdown>

    <cds-date-picker
      [label]="'adminSettings.opensearch.reindex.modifiedAfter' | translate"
      placeholder="DD-MM-YYYY"
      [dateFormat]="'d-m-Y'"
      (valueChange)="onDateSelected($event)"
    ></cds-date-picker>
  </section>

  <cds-modal-footer>
    <button cdsButton="secondary" (click)="onCancel()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button cdsButton="primary" (click)="onSubmit()">
      {{ 'adminSettings.opensearch.reindex.startButton' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
