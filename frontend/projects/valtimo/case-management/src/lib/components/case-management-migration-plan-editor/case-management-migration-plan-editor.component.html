<div class="migration-plan-editor">
  <cds-tabs type="contained">
    <cds-tab
      [heading]="'caseManagement.migration.editor.tabs.general' | translate"
      [attr.data-test-id]="testIds.generalTab"
    >
      <valtimo-migration-general-tab
        [caseDefinitionKey]="$caseDefinitionKey()"
        [caseDefinitionVersionTag]="$caseDefinitionVersionTag()"
        [isEdit]="$isEdit()"
        [plan]="$plan()"
        [runAfterOptions]="$runAfterOptions()"
        [sourceKeyOptions]="$sourceKeyOptions()"
        [sourceVersionOptions]="$sourceVersionOptions()"
        (generalChange)="onGeneralChange($event)"
      ></valtimo-migration-general-tab>
    </cds-tab>

    <cds-tab
      [heading]="'caseManagement.migration.editor.tabs.dataMigration' | translate"
      [attr.data-test-id]="testIds.dataMigrationTab"
    >
      <valtimo-migration-data-migration-tab
        [sourceContext]="$sourceCaseContext()"
        [targetContext]="$caseContext()"
        [targetAdditionalVersionTags]="$targetAdditionalVersionTags()"
        [patches]="$plan().dataMigration"
        (patchesChange)="onDataMigrationChange($event)"
      ></valtimo-migration-data-migration-tab>
    </cds-tab>

    <cds-tab
      [heading]="'caseManagement.migration.editor.tabs.processMigration' | translate"
      [attr.data-test-id]="testIds.processMigrationTab"
    >
      <valtimo-migration-process-migration-tab
        [caseDefinitionKey]="$caseDefinitionKey()"
        [caseDefinitionVersionTag]="$caseDefinitionVersionTag()"
        [sourceContext]="$caseContext()"
        [sourceProcessDefinitions]="$sourceProcessDefs()"
        [targetProcessDefinitions]="$targetProcessDefs()"
        [instructions]="$plan().processMigration"
        (instructionsChange)="onProcessMigrationChange($event)"
      ></valtimo-migration-process-migration-tab>
    </cds-tab>

    <cds-tab
      [heading]="'caseManagement.migration.editor.tabs.addBuildingBlock' | translate"
      [attr.data-test-id]="testIds.addBuildingBlockTab"
    >
      <valtimo-migration-building-block-tab
        [mode]="'add'"
        [caseDefinitionKey]="$caseDefinitionKey()"
        [caseDefinitionVersionTag]="$caseDefinitionVersionTag()"
        [caseProcessDefinitions]="$targetProcessDefs()"
        [instructions]="$plan().addBuildingBlock"
        (instructionsChange)="onAddBuildingBlockChange($event)"
      ></valtimo-migration-building-block-tab>
    </cds-tab>

    <cds-tab
      [heading]="'caseManagement.migration.editor.tabs.removeBuildingBlock' | translate"
      [attr.data-test-id]="testIds.removeBuildingBlockTab"
    >
      <valtimo-migration-building-block-tab
        [mode]="'remove'"
        [caseDefinitionKey]="$caseDefinitionKey()"
        [caseDefinitionVersionTag]="$caseDefinitionVersionTag()"
        [caseProcessDefinitions]="$targetProcessDefs()"
        [instructions]="$plan().removeBuildingBlock"
        (instructionsChange)="onRemoveBuildingBlockChange($event)"
      ></valtimo-migration-building-block-tab>
    </cds-tab>

    <cds-tab
      [heading]="'caseManagement.migration.editor.tabs.jsonEditor' | translate"
      [attr.data-test-id]="testIds.jsonEditorTab"
    >
      @if ($model(); as model) {
        <valtimo-editor
          [model]="model"
          [fitPage]="true"
          (validEvent)="onValid($event)"
          (valueChangeEvent)="onValueChange($event)"
        ></valtimo-editor>
      }
    </cds-tab>
  </cds-tabs>
</div>

<ng-container renderInPageHeader>
  <ng-template>
    <div *ngIf="{compactMode: compactMode$ | async} as obs" class="migration-plan-editor__actions">
      <button
        cdsButton="ghost"
        [size]="obs.compactMode ? 'sm' : 'md'"
        [attr.data-test-id]="testIds.cancelButton"
        (click)="onCancel()"
      >
        {{ 'interface.cancel' | translate }}
      </button>

      <button
        cdsButton="primary"
        [size]="obs.compactMode ? 'sm' : 'md'"
        [attr.data-test-id]="testIds.saveButton"
        [disabled]="!$canSave()"
        (click)="onSave()"
      >
        {{ 'interface.save' | translate }}
      </button>
    </div>
  </ng-template>
</ng-container>
