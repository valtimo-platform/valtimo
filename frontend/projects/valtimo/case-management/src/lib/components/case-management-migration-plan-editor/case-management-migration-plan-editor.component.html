<div class="migration-plan-editor">
  <div class="migration-plan-editor__header">
    <h3 class="migration-plan-editor__title">
      {{
        ($isEdit() ? 'caseManagement.migration.editor.editTitle' : 'caseManagement.migration.editor.createTitle')
          | translate
      }}
    </h3>

    <div class="migration-plan-editor__actions">
      <button cdsButton="ghost" [attr.data-test-id]="testIds.cancelButton" (click)="onCancel()">
        {{ 'interface.cancel' | translate }}
      </button>
      <button
        cdsButton="primary"
        [attr.data-test-id]="testIds.saveButton"
        [disabled]="!$valid() || $saving()"
        (click)="onSave()"
      >
        {{ 'interface.save' | translate }}
      </button>
    </div>
  </div>

  <cds-tabs type="contained">
    <cds-tab [heading]="'caseManagement.migration.editor.tabs.jsonEditor' | translate">
      @if ($model(); as model) {
        <valtimo-editor
          [model]="model"
          [fitPage]="true"
          (validEvent)="onValid($event)"
          (valueChangeEvent)="onValueChange($event)"
        ></valtimo-editor>
      }
    </cds-tab>
  </cds-tabs>
</div>
