<cds-modal [open]="open" showFooter="true" valtimoCdsModal (close)="onCloseModal()">
  <cds-modal-header showCloseButton="true" (closeSelect)="onCloseModal()">
    <h3 cdsModalHeaderHeading>
      {{ (column ? 'caseManagement.groups.listColumns.editColumn' : 'caseManagement.groups.listColumns.addColumn') | translate }}
    </h3>
  </cds-modal-header>

  <form [formGroup]="formGroup" cdsModalContent [cdsLayer]="1">
    <cds-label>
      {{ 'caseManagement.groups.listColumns.columnKey' | translate }}

      <input
        formControlName="key"
        cdsText
        [placeholder]="'caseManagement.groups.listColumns.columnKeyPlaceholder' | translate"
        [attr.modal-primary-focus]="!column"
      />
    </cds-label>

    <cds-label>
      {{ 'caseManagement.groups.listColumns.columnTitle' | translate }}

      <input
        formControlName="title"
        cdsText
        [placeholder]="'caseManagement.groups.listColumns.columnTitlePlaceholder' | translate"
        [attr.modal-primary-focus]="!!column"
      />
    </cds-label>

    <cds-dropdown
      formControlName="displayType"
      [label]="'caseManagement.groups.listColumns.displayType' | translate"
    >
      <cds-dropdown-list [items]="DISPLAY_TYPE_ITEMS"></cds-dropdown-list>
    </cds-dropdown>

    <cds-toggle
      formControlName="sortable"
      [label]="'caseManagement.groups.listColumns.sortable' | translate"
    ></cds-toggle>

    <cds-toggle
      formControlName="exportable"
      [label]="'caseManagement.groups.listColumns.exportable' | translate"
    ></cds-toggle>
  </form>

  <cds-modal-footer>
    <button cdsButton="secondary" (click)="onCloseModal()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button cdsButton="primary" [disabled]="formGroup.invalid" (click)="onCloseModal(true)">
      {{ 'interface.save' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
