<div
  *ngIf="{currentTab: currentTab$ | async, group: group$ | async} as obs"
  class="case-definition-group-detail-container"
>
  @if (showNoListColumnsWarning$ | async) {
    <cds-notification
      [notificationObj]="{
        type: 'warning',
        title: ('caseManagement.groups.noListColumnsWarning.title' | translate),
        message: ('caseManagement.groups.noListColumnsWarning.message' | translate),
        showClose: false,
        lowContrast: true,
      }"
      class="case-definition-group-detail__no-list-columns-warning"
      [attr.data-test-id]="testIds.noListColumnsWarning"
    ></cds-notification>
  }

  <cds-tabs class="case-management-tabs" type="inline" [attr.data-test-id]="testIds.tabs">
    <cds-tab
      class="no-padding-left-right main-content"
      [id]="GroupTabEnum.CONFIG"
      [heading]="'caseManagement.groups.tabs.config' | translate"
      [active]="obs.currentTab === GroupTabEnum.CONFIG"
      (selected)="navigateToTab(GroupTabEnum.CONFIG)"
    ></cds-tab>

    <cds-tab
      class="no-padding-left-right main-content"
      [id]="GroupTabEnum.LIST_COLUMNS"
      [heading]="'caseManagement.groups.tabs.listColumns' | translate"
      [active]="obs.currentTab === GroupTabEnum.LIST_COLUMNS"
      (selected)="navigateToTab(GroupTabEnum.LIST_COLUMNS)"
    ></cds-tab>

    <cds-tab
      class="no-padding-left-right main-content"
      [id]="GroupTabEnum.SEARCH_FIELDS"
      [heading]="'caseManagement.groups.tabs.searchFields' | translate"
      [active]="obs.currentTab === GroupTabEnum.SEARCH_FIELDS"
      (selected)="navigateToTab(GroupTabEnum.SEARCH_FIELDS)"
    ></cds-tab>
  </cds-tabs>

  <div class="case-definition-group-detail-container__content">
    <router-outlet></router-outlet>
  </div>
</div>

<valtimo-case-definition-group-create-modal
  [editMode]="true"
  [group]="group$ | async"
  [open]="(showEditModal$ | async) ?? false"
  (closeEvent)="onCloseEditModal()"
  (saveEvent)="onSaveGroup($event)"
></valtimo-case-definition-group-create-modal>

<ng-container renderInPageHeader>
  <ng-template>
    <button
      cdsButton="ghost"
      [disabled]="$exporting()"
      [size]="(compactMode$ | async) ? 'sm' : 'md'"
      (click)="exportGroup()"
      class="case-definition-group-detail__export-button"
      [attr.data-test-id]="testIds.exportButton"
    >
      {{ 'caseManagement.groups.export.button' | translate }}

      <svg class="cds--btn__icon" cdsIcon="download" size="16"></svg>
    </button>

    <button
      cdsButton="tertiary"
      [attr.data-test-id]="testIds.editButton"
      [disabled]="(group$ | async) === null"
      [size]="(compactMode$ | async) ? 'sm' : 'md'"
      (click)="openEditModal()"
    >
      {{ 'interface.edit' | translate }}

      <svg class="cds--btn__icon" cdsIcon="edit" size="16"></svg>
    </button>
  </ng-template>
</ng-container>
