<cds-modal [open]="open" showFooter="true" valtimoCdsModal (close)="onCloseModal()">
  <cds-modal-header showCloseButton="true" (closeSelect)="onCloseModal()">
    <h3 cdsModalHeaderHeading>
      {{ 'caseManagement.groups.createModal.title' | translate }}
    </h3>
  </cds-modal-header>

  <form [formGroup]="formGroup" cdsModalContent [cdsLayer]="1">
    <cds-label>
      {{ 'caseManagement.groups.createModal.name' | translate }}

      <input
        formControlName="title"
        cdsText
        placeholder="{{ 'caseManagement.groups.createModal.namePlaceholder' | translate }}"
        [attr.modal-primary-focus]="true"
      />
    </cds-label>

    <cds-label>
      {{ 'caseManagement.groups.createModal.description' | translate }}

      <input
        formControlName="description"
        cdsText
        placeholder="{{ 'caseManagement.groups.createModal.descriptionPlaceholder' | translate }}"
      />
    </cds-label>
  </form>

  <cds-modal-footer>
    <button cdsButton="secondary" (click)="onCloseModal()">
      {{ 'interface.cancel' | translate }}
    </button>

    <button cdsButton="primary" [disabled]="formGroup.invalid" (click)="onCloseModal(true)">
      {{ 'interface.create' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
