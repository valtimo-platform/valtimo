<cds-modal
  [open]="open"
  showFooter="true"
  valtimoCdsModal
  class="valtimo-group-create"
  (close)="onCloseModal()"
  [attr.data-test-id]="testIds.modal"
>
  <cds-modal-header showCloseButton="true" (closeSelect)="onCloseModal()">
    <h3 cdsModalHeaderHeading>
      {{
        (isEditMode
          ? 'caseManagement.groups.editModal.title'
          : 'caseManagement.groups.createModal.title'
        ) | translate
      }}
    </h3>
  </cds-modal-header>

  <form
    [formGroup]="formGroup"
    cdsModalContent
    [cdsLayer]="1"
    class="valtimo-group-create__content"
  >
    <cds-label>
      {{ 'caseManagement.groups.createModal.name' | translate }}

      <input
        formControlName="title"
        cdsText
        placeholder="{{ 'caseManagement.groups.createModal.namePlaceholder' | translate }}"
        [attr.modal-primary-focus]="true"
        [attr.data-test-id]="testIds.titleInput"
      />
    </cds-label>

    <cds-label>
      {{ 'caseManagement.groups.createModal.description' | translate }}

      <input
        formControlName="description"
        cdsText
        placeholder="{{ 'caseManagement.groups.createModal.descriptionPlaceholder' | translate }}"
        [attr.data-test-id]="testIds.descriptionInput"
      />
    </cds-label>
  </form>

  <cds-modal-footer>
    <button
      cdsButton="secondary"
      (click)="onCloseModal()"
      [attr.data-test-id]="testIds.cancelButton"
    >
      {{ 'interface.cancel' | translate }}
    </button>

    <button
      cdsButton="primary"
      [disabled]="formGroup.invalid"
      (click)="onCloseModal(true)"
      [attr.data-test-id]="testIds.submitButton"
    >
      {{ (isEditMode ? 'interface.save' : 'interface.create') | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
