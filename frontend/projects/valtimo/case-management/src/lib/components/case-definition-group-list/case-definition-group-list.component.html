<valtimo-carbon-list
  [items]="groups$ | async"
  [fields]="fields"
  (rowClicked)="onRowClick($event)"
>
  <ng-container carbonToolbarContent [ngTemplateOutlet]="toolbarContent"></ng-container>

  <valtimo-no-results
    [action]="toolbarContent"
    [description]="'caseManagement.groups.noResults.description' | translate"
    [title]="'caseManagement.groups.noResults.title' | translate"
  ></valtimo-no-results>
</valtimo-carbon-list>

<ng-template #toolbarContent>
  <button cdsButton="primary" (click)="showCreateModal()">
    {{ 'interface.create' | translate }}
    <svg cdsIcon="add" size="16" class="cds--btn__icon"></svg>
  </button>
</ng-template>

<valtimo-case-definition-group-create-modal
  [open]="showCreateModal$ | async"
  (closeEvent)="onCloseCreateModal($event)"
></valtimo-case-definition-group-create-modal>
